<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>仙居麻将 · 人机对战</title>
<style>
/* 仙居麻将 · 牌桌样式 */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }

body {
  background: radial-gradient(ellipse at center, #2d6a3f 0%, #1d4a2a 60%, #12351d 100%);
  color: #f5f0e1;
}

#table {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  position: relative;
}

/* ===== 顶栏 ===== */
#topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 12px; background: rgba(0,0,0,.35); flex: 0 0 auto;
  border-bottom: 1px solid rgba(255,255,255,.1);
  /* 全面屏安全区：横屏刘海/圆角不遮挡 */
  padding-left: calc(12px + env(safe-area-inset-left, 0px));
  padding-right: calc(12px + env(safe-area-inset-right, 0px));
}
#player-area { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
.logo { font-weight: 700; font-size: 16px; color: #ffd76a; letter-spacing: 1px; }
.tag {
  margin-left: 10px; padding: 2px 8px; border-radius: 4px;
  background: #c0392b; font-size: 12px; color: #fff;
}
.tag.god { background: linear-gradient(135deg,#f39c12,#e67e22); }
.tb-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: #cfd8ca; }
.mini-btn {
  padding: 3px 10px; background: rgba(255,255,255,.15); color: #fff;
  border: 1px solid rgba(255,255,255,.3); border-radius: 4px; cursor: pointer; font-size: 12px;
}
.mini-btn:hover { background: rgba(255,255,255,.3); }

/* ===== 牌桌主区（四边布局：我下 / 南右 / 西上 / 北左） ===== */
#table-main { flex: 1 1 auto; position: relative; min-height: 0; }

/* 三家对手：西家（上）/ 北家（左）/ 南家（右） */
.opp { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 6; }
#opp-3 { top: 4px; left: 50%; transform: translateX(-50%); }
#opp-4 { left: 8px; top: 50%; transform: translateY(-50%); }
#opp-2 { right: 8px; top: 50%; transform: translateY(-50%); }
.opp-info { display: flex; align-items: center; gap: 6px; font-size: 12px; flex-wrap: wrap; justify-content: center; max-width: 200px; }
.seat-name { color: #ffd76a; font-weight: 600; background: rgba(0,0,0,.3); padding: 1px 6px; border-radius: 3px; }
.opp-info .is-dealer { color: #e74c3c; }
.opp-tiles { font-size: 12px; color: #c8d6c0; background: rgba(0,0,0,.25); padding: 1px 8px; border-radius: 3px; }
.opp-melds, .opp-flowers { font-size: 11px; color: #aed6a0; }
.opp.thinking .seat-name { background: rgba(255,215,106,.28); box-shadow: 0 0 6px rgba(255,215,106,.45); }
@keyframes thinkPulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* 对手手牌：上方横排，左右两家竖排 */
.opp-hand { display: flex; gap: 0; }
.opp-hand .back-tile {
  width: 20px; height: 24px; margin-left: -10px;
  background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHhtbDpzcGFjZT0icHJlc2VydmUiIGlkPSJzdmcyOTg1IiB4PSIwIiB5PSIwIiBzdHlsZT0iZW5hYmxlLWJhY2tncm91bmQ6bmV3IC0xOTIgMjkzLjkgMjEwIDI1NSIgdmVyc2lvbj0iMS4xIiB2aWV3Qm94PSItMTkyIDI5My45IDIxMCAyNTUiPjxzdHlsZT4uc3Q1e2ZpbGw6I2ZmZn08L3N0eWxlPjxzd2l0Y2g+PGc+PGZpbHRlciBpZD0iZmlsdGVyMzk3MC01IiB3aWR0aD0iMS4yMTciIGhlaWdodD0iMS4yMTUiIHg9Ii0uMTA5IiB5PSItLjEwOCIgY29sb3ItaW50ZXJwb2xhdGlvbi1maWx0ZXJzPSJzUkdCIj48ZmVHYXVzc2lhbkJsdXIgaWQ9ImZlR2F1c3NpYW5CbHVyMzk3Mi04IiBzdGREZXZpYXRpb249Ii4xMjgiLz48L2ZpbHRlcj48ZyBpZD0iZzQ2MzAiIHN0eWxlPSJlbmFibGUtYmFja2dyb3VuZDpuZXciIHRyYW5zZm9ybT0ibWF0cml4KDEuMDAwNiAwIDAgMSAtMS4zNzYgMjAzLjQwNikiPjxnIGlkPSJnMzA2MiI+PHBhdGggaWQ9InJlY3Q0MDMxIiBkPSJtLTEzMS4yIDkwLjUgNDYuMS4yIDY4LjQtLjJjMjIuOS0uMSAzNi4xIDE1LjkgMzYuMSA0MC40djE1NC42YzAgMTIuMy0xNCAyNy43LTIxLjQgMzUuN3MtMjIuMSAyNC4zLTMzLjYgMjQuM2gtMTEzYy0yMi45IDAtNDEuMy01LjYtNDEuMy0zMC4ybC0uMy0xNjIuM2MwLTYuNCAxNy4zLTI0LjMgMjQuOC0zMi40IDcuNC04IDIyLjctMzAuMiAzNC4yLTMwLjEiLz48cGF0aCBpZD0icmVjdDM3NjciIGQ9Ik0tMTIyLjQgMTAzLjJoMTA0LjVjMTMuOCAwIDI0LjggMTEuMSAyNC45IDI0LjlsLjkgMTUyLjRjMCAyLTEyLjYgMzItMjUuOCAzMmgtMTA0LjVjLTEzLjggMC0yNC45LTExLjEtMjQuOS0yNC45VjEyOC4xYzAtMTMuOCAxMS4xLTI0LjkgMjQuOS0yNC45IiBzdHlsZT0iZmlsbDojY2RkYWNkIi8+PHBhdGggaWQ9InJlY3QzODYxIiBkPSJNLTEzNy40IDExOC4xaDk5LjZjMTMuNyAwIDI0LjkgMTEuMiAyNC45IDI0Ljl2MTU5LjVjMCAxMy44LTExLjEgMjQuOS0yNC45IDI0LjloLTk5LjZjLTEzLjcgMC0yNC45LTExLjItMjQuOS0yNC45VjE0My4xYzAtMTMuOCAxMS4yLTI1IDI0LjktMjUiIHN0eWxlPSJmaWxsOiMwNTNkMDUiLz48cGF0aCBpZD0icmVjdDM3NjUiIGQ9Ik0tMTQ3LjMgMTMzLjFoMTA0LjVjMTMuNyAwIDI0LjkgMTEuMiAyNC45IDI0Ljl2MTQ5LjVjMCAxMy44LTExLjEgMjQuOS0yNC45IDI0LjloLTEwNC41Yy0xMy43IDAtMjQuOS0xMS4yLTI0LjktMjQuOVYxNThjMC0xMy43IDExLjEtMjQuOSAyNC45LTI0LjkiIHN0eWxlPSJmaWxsOiMwMjRjMDIiLz48cGF0aCBpZD0icmVjdDMwMDgiIGQ9Ik0tMTU3LjMgMTQzLjFoMTA5LjVjMTEgMCAxOS45IDguOSAxOS45IDE5Ljl2MTQ5LjVjMCAxMS04LjkgMTkuOS0xOS45IDE5LjloLTEwOS41Yy0xMSAwLTE5LjktOC45LTE5LjktMTkuOVYxNjNjMC0xMSA4LjktMTkuOSAxOS45LTE5LjkiIHN0eWx }
.opp-hand .back-tile:first-child { margin-left: 0; }
.opp-hand.v { flex-direction: column; }
.opp-hand.v .back-tile { margin-left: 0; margin-top: -15px; }
.opp-hand.v .back-tile:first-child { margin-top: 0; }
.opp-hand .back-tile.recent {
  filter: drop-shadow(0 0 5px rgba(240,192,64,.95)) sepia(.35) saturate(1.4);
}

/* ===== 弃牌区：每家打出的牌排在自己面前 ===== */
.discard-pile { position: absolute; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; justify-content: center; z-index: 5; }
#discard-1 { left: 50%; bottom: 8px; transform: translateX(-50%); width: 470px; max-height: 68px; overflow: hidden; }
#discard-3 { left: 50%; top: 96px; transform: translateX(-50%); width: 330px; max-height: 68px; overflow: hidden; }
#discard-4 { left: 128px; top: 50%; transform: translateY(-50%); width: 120px; max-height: 340px; overflow: hidden; }
#discard-2 { right: 128px; top: 50%; transform: translateY(-50%); width: 120px; max-height: 340px; overflow: hidden; }

/* 最新打出的一张牌：红圈标注，一眼可见 */
.tile.fresh { cursor: default; z-index: 3; }
.tile.fresh::after {
  content: ''; position: absolute; inset: -3px; border: 2px solid #ff5252; border-radius: 7px;
  box-shadow: 0 0 9px rgba(255,82,82,.85), inset 0 0 4px rgba(255,82,82,.4);
  animation: freshPulse .9s infinite; pointer-events: none;
}
@keyframes freshPulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

/* ===== 倒计时钟（当前行动玩家前方：我上 / 对家下 / 左家右 / 右家左） ===== */
#countdown-clock { position: absolute; width: 66px; height: 66px; z-index: 20; display: none; }
#countdown-clock.show { display: block; }
#countdown-clock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#countdown-clock .clock-bg { fill: rgba(0,0,0,.6); stroke: rgba(255,255,255,.25); stroke-width: 3; }
#countdown-clock .clock-ring { fill: none; stroke: #ffd76a; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 163.4; }
#countdown-clock.urgent .clock-ring { stroke: #ff5252; }
#countdown-clock.urgent #clock-num { color: #ff6b6b; }
#countdown-clock.urgent { animation: thinkPulse .6s infinite; }
#clock-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #ffd76a; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
#countdown-clock.pos-1 { left: 50%; bottom: 92px; transform: translateX(-50%); }
#countdown-clock.pos-3 { left: 50%; top: 172px; transform: translateX(-50%); }
#countdown-clock.pos-4 { left: 258px; top: 50%; transform: translateY(-50%); }
#countdown-clock.pos-2 { right: 258px; top: 50%; transform: translateY(-50%); }

#center-deco { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; font-size: 56px; font-weight:800; color: rgba(255,255,255,.13); letter-spacing: 14px; pointer-events:none; }
#msg-bar {
  position: absolute; top: calc(50% + 44px); left: 50%; transform: translateX(-50%);
  font-size: 13px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 14px; border-radius: 10px;
  white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; z-index: 8;
}

/* ===== 牌面（Wikimedia 官方牌面素材，宽高比 210:255） ===== */
.tile {
  width: 52px; height: 63px;
  display: inline-block; position: relative;
  background: transparent; border: none;
  cursor: pointer; flex-shrink: 0; padding: 0;
  transition: transform .08s, filter .08s;
}
.tile img.tile-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tile.selected { transform: translateY(-11px); filter: drop-shadow(0 0 7px rgba(255,215,0,.9)) drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
.tile.small { width: 35px; height: 42px; }
.tile.tiny { width: 26px; height: 31px; cursor: default; }
.tile.god-mark { outline: 2px solid #f39c12; outline-offset: 1px; z-index: 2; border-radius: 5px; }

/* 玩家手牌 */
#player-area { flex: 0 0 auto; padding: 6px 16px 8px; background: rgba(0,0,0,.28); border-top: 1px solid rgba(255,255,255,.1); }
#player-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; margin-bottom: 4px; }
#my-score { color: #ffd76a; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.hand-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 3px; min-height: 64px; }
.hand-row .tile { margin: 0 -1px; }
.meld-row { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; min-height: 40px; margin-bottom: 2px; }
.meld { display: flex; gap: 1px; background: rgba(255,255,255,.06); padding: 2px; border-radius: 3px; }
.meld .tile { width: 30px; height: 36px; }

/* 花牌行 */
.flower-row { display: flex; gap: 2px; }

/* ===== 操作按钮 ===== */
#actions {
  position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 10;
}
.act-btn {
  padding: 10px 22px; font-size: 16px; font-weight: 700; border: none; border-radius: 8px;
  cursor: pointer; background: linear-gradient(160deg,#f0c040,#d4a017); color: #3c2a00;
  box-shadow: 0 3px 8px rgba(0,0,0,.4);
}
.act-btn.win { background: linear-gradient(160deg,#e74c3c,#c0392b); color: #fff; animation: pulse 0.8s infinite; }
.act-btn.pass { background: linear-gradient(160deg,#7f8c8d,#636e72); color: #fff; }
.act-btn.discard { background: linear-gradient(160deg,#2ecc71,#1e9e52); color: #fff; }
.act-btn:hover { filter: brightness(1.1); }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

/* ===== 弹窗 ===== */
#overlay, #chi-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100;
  display: flex; align-items: center; justify-content: center;
}
#result-box {
  background: linear-gradient(160deg,#fefdf7,#f0ead6); color: #2f3640;
  padding: 24px 32px; border-radius: 14px; min-width: 300px; max-width: 92vw;
  max-height: 88vh; overflow-y: auto; text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.6);
}
#result-title { font-size: 24px; color: #c0392b; margin-bottom: 8px; }
#result-tai { font-size: 32px; font-weight: 800; color: #d4a017; margin-bottom: 8px; }
#result-detail { font-size: 13px; color: #636e72; line-height: 1.8; margin-bottom: 8px; }
#result-scores { font-size: 14px; margin-bottom: 8px; line-height: 1.8; }
#result-scores .me { color: #c0392b; font-weight: 700; }
#result-hand { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin-bottom: 14px; }
.btn-row { display: flex; gap: 12px; justify-content: center; }
.big-btn {
  padding: 10px 26px; font-size: 16px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer;
  background: linear-gradient(160deg,#2d6a3f,#1d4a2a); color: #fff;
}
.big-btn.ghost { background: linear-gradient(160deg,#7f8c8d,#636e72); }
.big-btn:hover { filter: brightness(1.15); }

#chi-box { background: linear-gradient(160deg,#fefdf7,#f0ead6); color: #2f3640; padding: 18px 24px; border-radius: 12px; }
#chi-options { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; justify-content: center; }
#chi-options .chi-opt { display: flex; gap: 2px; padding: 6px 8px; background: #e8e0c8; border-radius: 6px; cursor: pointer; }
#chi-options .chi-opt:hover { background: #f0c040; }

/* ===== 手机端：强制横屏（竖屏持机时整体旋转 90°，无需手机转过来） ===== */
/* JS 会给 body 加类：.mobile=触屏手机；.landscape-lock=当前竖屏需旋转 */
body.landscape-lock { overflow: hidden; }
body.landscape-lock #table {
  position: fixed; top: 0; left: 0;
  width: 100vh; height: 100vw;
  transform: translateX(100vw) rotate(90deg);
  transform-origin: 0 0;
}

/* ===== 手机端横屏几何（真实横屏与强制横屏共用同一套） ===== */
body.mobile #topbar { padding: 2px 10px; }
body.mobile .logo { font-size: 12px; letter-spacing: 0; }
body.mobile .tag { font-size: 10px; padding: 1px 5px; margin-left: 4px; }
body.mobile .tb-right { gap: 6px; font-size: 11px; }
body.mobile .mini-btn { padding: 2px 8px; font-size: 11px; }
body.mobile #turn-info { max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

body.mobile .tile { width: 40px; height: 49px; }
body.mobile .hand-row .tile { margin: 0 -3px; }
body.mobile .tile.tiny { width: 22px; height: 27px; }
body.mobile .meld .tile { width: 26px; height: 31px; }

body.mobile #player-area { padding: 2px 10px 4px; }
body.mobile #player-meta { font-size: 11px; margin-bottom: 1px; }
body.mobile .meld-row { min-height: 30px; }
body.mobile .hand-row { min-height: 50px; }

body.mobile #opp-3 { top: 2px; }
body.mobile .opp-hand .back-tile { width: 14px; height: 17px; margin-left: -6px; }
body.mobile .opp-hand.v .back-tile { margin-left: 0; margin-top: -9px; }
body.mobile .opp-info { font-size: 10px; gap: 4px; }
body.mobile #opp-4 { left: 6px; }
body.mobile #opp-2 { right: 6px; }

body.mobile #discard-3 { top: 58px; width: 300px; max-height: 56px; }
body.mobile #discard-1 { bottom: 4px; width: 480px; max-height: 56px; }
body.mobile #discard-4 { left: 13%; width: 110px; max-height: 165px; }
body.mobile #discard-2 { right: 13%; width: 110px; max-height: 165px; }

body.mobile #countdown-clock { width: 52px; height: 52px; }
body.mobile #clock-num { font-size: 18px; }
body.mobile #countdown-clock.pos-1 { bottom: 60px; }
body.mobile #countdown-clock.pos-3 { top: 118px; }
body.mobile #countdown-clock.pos-4 { left: calc(13% + 120px); }
body.mobile #countdown-clock.pos-2 { right: calc(13% + 120px); }

body.mobile #center-deco { font-size: 28px; letter-spacing: 8px; }
body.mobile #msg-bar { font-size: 11px; top: calc(50% + 24px); padding: 3px 10px; }
body.mobile #actions { bottom: 92px; }
body.mobile .act-btn { padding: 8px 14px; font-size: 13px; }

</style>
</head>
<body>
<!-- 牌桌 -->
<div id="table">
  <!-- 顶部信息栏 -->
  <div id="topbar">
    <div class="tb-left">
      <span class="logo">🀄 仙居麻将</span>
      <span id="dealer-tag" class="tag">庄家</span>
      <span id="god-tag" class="tag god">财神</span>
    </div>
    <div class="tb-right">
      <span id="wall-info">牌墙 0</span>
      <span id="turn-info"></span>
      <button id="btn-fullscreen" class="mini-btn">全屏</button>
      <button id="btn-restart" class="mini-btn">重新开局</button>
    </div>
  </div>

  <!-- 牌桌主区（四边布局：我下 / 南右 / 西上 / 北左） -->
  <div id="table-main">
    <!-- 对家：西家（上方） -->
    <div class="opp" id="opp-3">
      <div class="opp-info"><span class="seat-name">西家</span><span class="opp-tiles"></span><span class="opp-melds"></span><span class="opp-flowers"></span></div>
      <div class="opp-hand" id="hand-3"></div>
    </div>
    <!-- 上家：北家（左方） -->
    <div class="opp" id="opp-4">
      <div class="opp-info"><span class="seat-name">北家</span><span class="opp-tiles"></span><span class="opp-melds"></span><span class="opp-flowers"></span></div>
      <div class="opp-hand v" id="hand-4"></div>
    </div>
    <!-- 下家：南家（右方） -->
    <div class="opp" id="opp-2">
      <div class="opp-info"><span class="seat-name">南家</span><span class="opp-tiles"></span><span class="opp-melds"></span><span class="opp-flowers"></span></div>
      <div class="opp-hand v" id="hand-2"></div>
    </div>

    <!-- 弃牌区：每家打出的牌排在自己面前 -->
    <div class="discard-pile" id="discard-3"></div>  <!-- 西家（上）面前 -->

<script>
/**
 * tiles.js — 仙居麻将 牌定义与工具
 * 牌张模型：{ suit, num }
 *  suit: 'wan'|'tong'|'tiao'|'feng'|'jian'|'flower'
 *  num:  1-9 数字牌；1-4 风牌(东南西北)；1-3 箭牌(中发白)；1-8 花牌(梅兰竹菊春夏秋冬)
 */
(function () {


const SUITS = ['wan', 'tong', 'tiao', 'feng', 'jian', 'flower'];

// 花牌编号：1梅 2兰 3竹 4菊（对应东1南2西3北4） 5春 6夏 7秋 8冬
const FLOWER_NAMES = ['梅', '兰', '竹', '菊', '春', '夏', '秋', '冬'];
const FENG_NAMES = ['东', '南', '西', '北'];
const JIAN_NAMES = ['中', '发', '白'];

// 花色中文名
const SUIT_NAMES = {
  wan: '万', tong: '筒', tiao: '条',
  feng: '风', jian: '箭', flower: '花'
};

/** 生成一副完整牌（144 张：136 基础 + 8 花牌） */
function createDeck(includeFlowers = true) {
  const deck = [];
  for (const suit of ['wan', 'tong', 'tiao']) {
    for (let num = 1; num <= 9; num++) {
      for (let i = 0; i < 4; i++) deck.push({ suit, num });
    }
  }
  for (let num = 1; num <= 4; num++) {
    for (let i = 0; i < 4; i++) deck.push({ suit: 'feng', num });
  }
  for (let num = 1; num <= 3; num++) {
    for (let i = 0; i < 4; i++) deck.push({ suit: 'jian', num });
  }
  if (includeFlowers) {
    for (let num = 1; num <= 8; num++) deck.push({ suit: 'flower', num });
  }
  return deck;
}

/** Fisher-Yates 洗牌（原地） */
function shuffle(arr, rng = Math.random) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** 牌转中文名（含花牌） */
function tileToString(t) {
  if (!t) return '?';
  if (t.suit === 'flower') {
    return FLOWER_NAMES[t.num - 1];
  }
  const n = t.num;
  if (t.suit === 'feng') return FENG_NAMES[n - 1];
  if (t.suit === 'jian') return JIAN_NAMES[n - 1];
  const numStr = '一二三四五六七八九'[n - 1];
  return numStr + SUIT_NAMES[t.suit];
}

/** 花色+数字 → 统一排序键（排序用手牌） */
function tileSortKey(t) {
  const suitOrder = { wan: 0, tong: 1, tiao: 2, feng: 3, jian: 4, flower: 5 };
  return suitOrder[t.suit] * 100 + t.num;
}

/** 手牌排序（万→筒→条→风→箭→花） */
function sortHand(hand) {
  return hand.slice().sort((a, b) => tileSortKey(a) - tileSortKey(b));
}

/** 手牌 → 计数 Map（key: suit|num） */
function countTiles(hand) {
  const m = new Map();
  for (const t of hand) {
    const k = t.suit + '|' + t.num;
    m.set(k, (m.get(k) || 0) + 1);
  }
  return m;
}

/** 手牌 → 编码数组（如 {suit:'wan', num:1} 出现2次 → ['wan1','wan1']）用于递归计算 */
function handToCodeArray(hand) {
  return hand.map(t => t.suit + '|' + t.num);
}

/** 同牌是否相等 */
function sameTile(a, b) {
  return a && b && a.suit === b.suit && a.num === b.num;
}

/** 牌是否字牌（风/箭） */
function isHonor(t) {
  return t.suit === 'feng' || t.suit === 'jian';
}

/** 牌是否幺九（1/9 数字牌 或 字牌） */
function isYaoJiu(t) {
  if (t.suit === 'feng' || t.suit === 'jian') return true;
  return t.num === 1 || t.num === 9;
}

/** 花牌所属风座：梅/春→东(1)，兰/夏→南(2)，竹/秋→西(3)，菊/冬→北(4) */
function flowerSeat(t) {
  if (t.suit !== 'flower') return 0;
  return ((t.num - 1) % 4) + 1;
}

/** 玩家座位(1东 2南 3西 4北)对应的两张花牌号 */
function flowersForSeat(seat) {
  // 东(1): 梅(1)春(5)  南(2): 兰(2)夏(6)  西(3): 竹(3)秋(7)  北(4): 菊(4)冬(8)
  return [seat, seat + 4];
}

/** 手牌中某牌数量 */
function countInHand(hand, tile) {
  return hand.filter(t => sameTile(t, tile)).length;
}

// 兼容 Node (module.exports) 与 浏览器 (window.Tiles)
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    SUITS, FLOWER_NAMES, FENG_NAMES, JIAN_NAMES, SUIT_NAMES,
    createDeck, shuffle, tileToString, tileSortKey, sortHand,
    countTiles, countInHand, handToCodeArray, sameTile, isHonor, isYaoJiu,
    flowerSeat, flowersForSeat
  };
} else {
  window.Tiles = {
    SUITS, FLOWER_NAMES, FENG_NAMES, JIAN_NAMES, SUIT_NAMES,
    createDeck, shuffle, tileToString, tileSortKey, sortHand,
    countTiles, countInHand, handToCodeArray, sameTile, isHonor, isYaoJiu,
    flowerSeat, flowersForSeat
  };
}
})();
