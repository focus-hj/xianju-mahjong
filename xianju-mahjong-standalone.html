<script>
/**
 * rules.js — 仙居麻将规则引擎（v2 重写）
 * 依赖调研确认的规则：
 *  - 144张牌（136基础 + 8花牌：1梅2兰3竹4菊 5春6夏7秋8冬）
 *  - 财神（百搭）：骰子定风头（4张）+ 牌墙翻牌（3张），共7张，可替任意牌
 *  - 财神不能做将（脚）；用财神替面子要求手牌有"硬家(中发白)或自家风头"对子锚
 *  - 吃只能吃上家（真实顺子，不用财神）；碰分金碰/财神碰/双夹，金碰优先
 *  - 台数：庄2平1、风头+1、硬家各+1、硬碰硬(无财神)+1、碰碰胡+1、杠开+1、
 *          齐花+1、齐季+1、混一色+1、清一色+3、地胡+3、天胡+4、对座花牌+1/张
 *  - 截胡：逆时针（座位号递增）近者优先；诈胡赔付
 *
 * 座位约定：1东 2南 3西 4北，行牌方向座位号递增(1→2→3→4→1)，
 * 即东的下家是南；"上家"= 座位号递减方向 = ((seat+2)%4)+1
 */
(function () {


const T = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./tiles')
  : (window.Tiles || window.tiles);

const WIN_INF = 1e9;

/* ============ 财神 ============ */

function diceToSeat(dice) {
  const m = { 5:1,9:1, 2:2,6:2,10:2, 3:3,7:3,11:3, 4:4,8:4,12:4 };
  return m[dice] || 1;
}

function buildGodTiles(zhuangSeat, dice, flippedTile) {
  const seat = diceToSeat(dice);
  const gods = [{ suit: 'feng', num: seat }];
  if (flippedTile) gods.push({ suit: flippedTile.suit, num: flippedTile.num });
  return gods;
}

function isGod(tile, godTiles) {
  return !!godTiles && godTiles.some(g => T.sameTile(g, tile));
}

function countGods(hand, godTiles) {
  return hand.filter(t => isGod(t, godTiles)).length;
}

function countInHand(hand, tile) {
  return hand.filter(t => T.sameTile(t, tile)).length;
}

/* ============ 胡牌判定（带财神） ============ */

function removeN(arr, tile, n) {
  const out = arr.slice();
  let removed = 0;
  for (let i = 0; i < out.length && removed < n; i++) {
    if (T.sameTile(out[i], tile)) { out.splice(i, 1); removed++; i--; }
  }
  return out;
}

/**
 * minReplaceMelds — 用 tiles（真牌）+ godsLeft 张财神，凑出 needSets 个面子，
 * 返回最小"需要替换的真牌数"（废牌换成有用的）。不可行返回 WIN_INF。
 */
function minReplaceMelds(tiles, godsLeft, needSets) {
  if (needSets === 0) return tiles.length; // 剩余真牌都是废牌（需替换）
  if (tiles.length === 0) {
    // 牌耗尽但还要面子：缺的靠未来摸牌补齐；gods 不足则判远
    return godsLeft >= needSets * 3 ? 0 : WIN_INF;
  }
  const first = tiles[0];
  const c = countInHand(tiles, first);
  let best = WIN_INF;

  // 1) 刻子（用财神补缺）
  if (c >= 3) {
    best = Math.min(best, minReplaceMelds(tiles.slice(c), godsLeft, needSets - 1));
  } else if (godsLeft >= 3 - c) {
    best = Math.min(best, minReplaceMelds(tiles.slice(c), godsLeft - (3 - c), needSets - 1));
  }

  // 2) 顺子（仅数字牌，num<=7）
  if ((first.suit === 'wan' || first.suit === 'tong' || first.suit === 'tiao') && first.num <= 7) {
    const nt = [first, { suit: first.suit, num: first.num + 1 }, { suit: first.suit, num: first.num + 2 }];
    const have = nt.map(x => Math.min(countInHand(tiles, x), 1)).reduce((a, b) => a + b, 0);
    const miss = 3 - have;
    if (miss <= godsLeft) {
      let rem = tiles.slice();
      for (const x of nt) rem = removeN(rem, x, 1);
      best = Math.min(best, minReplaceMelds(rem, godsLeft - miss, needSets - 1));
    }
  }

  // 3) 跳过第一张（替换掉这张废牌）→ +1
  best = Math.min(best, 1 + minReplaceMelds(tiles.slice(c), godsLeft, needSets));

  return best;
}

/**
 * winReplace — 最小替换张数（0=已胡；1=听；2=一向听...）
 * 将(雀头)必须为真实对子（财神不能做脚）。
 * 锚规则（仙居）：用财神补面子时，手牌中必须存在"硬家(中发白)"或
 * "自家风头"的 对子/刻子，财神才能参与替牌；将可以是任意真对。
 * 原文："拥有财神无硬家或自家风头，财神不可替不能胡；
 *        有一对硬家或自家风头，财神可替，可等胡。"
 * @param opts { requireAnchor: 用财神时要求硬家/自家风锚, seat: 座位号 }
 */

/** 手牌中是否存在 硬家(中发白) 或 自家风 的对子/刻子 */
function hasAnchor(hand, seat) {
  for (const n of [1, 2, 3]) {
    if (countInHand(hand, { suit: 'jian', num: n }) >= 2) return true;
  }
  // 自家风（东家→东风...）
  if (seat > 0 && countInHand(hand, { suit: 'feng', num: seat }) >= 2) return true;
  // 无 seat 时宽松兜底：任意风对子也算锚（用于无座位上下文的判定）
  for (const n of [1, 2, 3, 4]) {
    if (countInHand(hand, { suit: 'feng', num: n }) >= 2) return true;
  }
  return false;
}

function winReplace(hand, godTiles, opts = {}) {
  const requireAnchor = opts.requireAnchor !== false;
  const seat = opts.seat || 0;
  const needSets = 4 - (opts.melds || []).length; // 已完成的吃碰杠面子
  const gods = countGods(hand, godTiles);
  const rest = hand.filter(t => !isGod(t, godTiles));
  const cnt = T.countTiles(rest);

  // 锚规则：若手中有财神，且牌型中不存在硬家/自家风的对或刻，则财神无法参与胡牌
  if (requireAnchor && gods > 0 && !hasAnchor(rest, seat)) {
    return WIN_INF;
  }

  let best = WIN_INF;

  // 枚举真将（财神不能做将，将可为任意真对）
  for (const [k, v] of cnt) {
    if (v < 2) continue;
    const [suit, num] = k.split('|');
    const pairTile = { suit, num: parseInt(num, 10) };
    const remaining = removeN(rest, pairTile, 2);
    const need = minReplaceMelds(remaining, gods, needSets);
    if (need < best) best = need;
  }

  return best;
}

function canWin(hand, godTiles, opts = {}) {
  return winReplace(hand, godTiles, opts) === 0;
}

/** 所有可进张的牌型（34种普通牌，花牌不算） */
function allDrawableTiles() {
  const res = [];
  for (const suit of ['wan', 'tong', 'tiao']) {
    for (let num = 1; num <= 9; num++) res.push({ suit, num });
  }
  for (let num = 1; num <= 4; num++) res.push({ suit: 'feng', num });
  for (let num = 1; num <= 3; num++) res.push({ suit: 'jian', num });
  return res;
}

/** 精确听牌判定：是否存在一张进张使手牌胡（支持任意张数，含吃碰后） */
function isTenpai(hand, godTiles, opts = {}) {
  for (const t of allDrawableTiles()) {
    if (countInHand(hand, t) >= 4) continue;
    if (winAfterDraw(hand, t, godTiles, opts)) return true;
  }
  return false;
}

/**
 * maxParts — 计算剩余牌最多能组成多少个 (面子, 搭子)
 * @param {Array} tilesArr 真牌数组
 * @returns {[melds, tatsu]}
 */
function maxParts(tilesArr) {
  const memo = new Map();
  function dfs(cnt) {
    let firstKey = null;
    for (const [k, v] of cnt) { if (v > 0) { firstKey = k; break; } }
    if (!firstKey) return [0, 0];
    const key = [...cnt.entries()].filter(([, v]) => v > 0).map(([k, v]) => k + ':' + v).sort().join(',');
    if (memo.has(key)) return memo.get(key);

    const [suit, numStr] = firstKey.split('|');
    const num = +numStr;
    let best = [0, 0];

    const consume = (tiles) => {
      const nc = new Map(cnt);
      for (const t of tiles) {
        const k = t.suit + '|' + t.num;
        if (!nc.has(k) || nc.get(k) <= 0) return null;
        nc.set(k, nc.get(k) - 1);
      }
      return nc;
    };
    const evalRes = (tiles, type) => {
      const nc = consume(tiles);
      if (!nc) return;
      const [m, t] = dfs(nc);
      const mm = m + (type === 'meld' ? 1 : 0);
      const tt = t + (type === 'tatsu' ? 1 : 0);
      const val = mm * 10 + Math.min(tt, 4 - mm);
      const curVal = best[0] * 10 + Math.min(best[1], 4 - best[0]);
      if (val > curVal) best = [mm, tt];
    };

    const isNum = suit === 'wan' || suit === 'tong' || suit === 'tiao';
    // 刻子
    if (cnt.get(firstKey) >= 3) evalRes([{ suit, num }, { suit, num }, { suit, num }], 'meld');
    // 顺子
    if (isNum && num <= 7) {
      evalRes([{ suit, num }, { suit, num: num + 1 }, { suit, num: num + 2 }], 'meld');
    }
    // 对子搭子
    if (cnt.get(firstKey) >= 2) evalRes([{ suit, num }, { suit, num }], 'tatsu');
    // 两面搭子
    if (isNum && num <= 8 && cnt.get(suit + '|' + (num + 1)) > 0) {
      evalRes([{ suit, num }, { suit, num: num + 1 }], 'tatsu');
    }
    // 嵌张搭子
    if (isNum && num <= 7 && cnt.get(suit + '|' + (num + 2)) > 0) {
      evalRes([{ suit, num }, { suit, num: num + 2 }], 'tatsu');
    }
    // 单张跳过
    {
      const nc = new Map(cnt);
      nc.set(firstKey, cnt.get(firstKey) - 1);
      const [m, t] = dfs(nc);
      const val = m * 10 + Math.min(t, 4 - m);
      const curVal = best[0] * 10 + Math.min(best[1], 4 - best[0]);
      if (val > curVal) best = [m, t];
    }
    memo.set(key, best);
    return best;
  }
  const cnt = new Map();
  for (const t of tilesArr) cnt.set(t.suit + '|' + t.num, (cnt.get(t.suit + '|' + t.num) || 0) + 1);
  return dfs(cnt);
}

/** 无财神向听数（部件法）：needSets*2 - 2*面子 - 搭子 - 雀头 */
function shantenNoGod(hand, needSets = 4) {
  const cnt = T.countTiles(hand);
  let bestSh = needSets * 2;
  // 无雀头
  {
    const tilesArr = hand.map(t => ({ suit: t.suit, num: t.num }));
    const [m, ta] = maxParts(tilesArr);
    const mm = Math.min(m, needSets);
    const t = Math.min(ta, needSets - mm);
    bestSh = Math.min(bestSh, needSets * 2 - 2 * mm - t);
  }
  // 枚举雀头（对子）
  for (const [k, v] of cnt) {
    if (v < 2) continue;
    const [suit, num] = k.split('|');
    const rest = removeN(hand, { suit, num: +num }, 2);
    const [m, ta] = maxParts(rest);
    const mm = Math.min(m, needSets);
    const t = Math.min(ta, needSets - mm);
    bestSh = Math.min(bestSh, needSets * 2 - 2 * mm - t - 1);
  }
  return bestSh;
}

/**
 * 向听数：-1已胡，0听牌，>0 步数（统一量纲）
 * 支持已完成的吃碰杠面子（opts.melds），手牌只需凑 (4-k) 个面子。
 */
function shanten(hand, godTiles, opts = {}) {
  const meldCount = (opts.melds || []).length;
  const needSets = 4 - meldCount;
  if (canWin(hand, godTiles, opts)) return -1;
  if (isTenpai(hand, godTiles, opts)) return 0;
  if (hand.length === 14) {
    // 14张未胡：打一张能否听牌 → 一向听
    for (let i = 0; i < hand.length; i++) {
      const rest = hand.slice(0, i).concat(hand.slice(i + 1));
      if (isTenpai(rest, godTiles, opts)) return 1;
    }
  }
  const gods = countGods(hand, godTiles);
  const rest = hand.filter(t => !isGod(t, godTiles));
  let st = shantenNoGod(rest, needSets);
  st = Math.max(0, st - gods); // 财神近似：每个财神减一向听
  return st;
}

function winAfterDraw(hand, tile, godTiles, opts = {}) {
  return canWin(hand.concat([tile]), godTiles, opts);
}

function isSevenPairs(hand, godTiles) {
  if (hand.length !== 14) return false;
  if (hand.some(t => isGod(t, godTiles))) return false;
  const cnt = T.countTiles(hand);
  for (const [, v] of cnt) if (v !== 2) return false;
  return true;
}

/* ============ 吃碰杠 ============ */

/** 吃只能吃上家（座位号递减方向）。真实顺子，不用财神。 */
function canChi(hand, discardTile, seat, lastDiscardSeat) {
  if (lastDiscardSeat !== ((seat + 2) % 4) + 1) return [];
  const t = discardTile;
  if (t.suit === 'feng' || t.suit === 'jian' || t.suit === 'flower') return [];
  const cnt = T.countTiles(hand);
  const res = [];
  for (const start of [t.num - 2, t.num - 1, t.num]) {
    if (start < 1 || start > 7) continue;
    const tiles = [start, start + 1, start + 2].map(n => ({ suit: t.suit, num: n }));
    let ok = true;
    for (const tt of tiles) {
      if (T.sameTile(tt, t)) continue;
      if ((cnt.get(tt.suit + '|' + tt.num) || 0) < 1) { ok = false; break; }
    }
    if (ok) res.push(tiles);
  }
  return res;
}

/** 碰：金碰(2真牌) > 财神碰(1真牌+1财神) > 双夹(2财神) */
function canPeng(hand, discardTile, godTiles) {
  const real = countInHand(hand, discardTile);
  const gods = countGods(hand, godTiles);
  if (real >= 2) return { type: 'gold' };
  if (real === 1 && gods >= 1) return { type: 'god' };
  if (real === 0 && gods >= 2) return { type: 'double' };
  return null;
}

/** 杠：discardTile 给定 → 明杠(手3张)；否则暗杠(手4张，财神不算) */
function canGang(hand, discardTile, godTiles) {
  if (discardTile) {
    if (countInHand(hand, discardTile) >= 3) return { type: 'ming', tile: discardTile };
    return null;
  }
  const cnt = T.countTiles(hand);
  for (const [k, v] of cnt) {
    if (v === 4) {
      const [suit, num] = k.split('|');
      return { type: 'an', tile: { suit, num: parseInt(num, 10) } };
    }
  }
  return null;
}

/** 补杠：碰过某牌又摸到第4张 */
function canBuGang(melds, hand, tile) {
  return melds.some(m => m.type === 'peng' && T.sameTile(m.tile, tile));
}

function isFlower(tile) { return tile.suit === 'flower'; }

/* ============ 台数计算 ============ */

function countWithMelds(hand, melds, tile) {
  let c = countInHand(hand, tile);
  for (const m of melds) {
    if (T.sameTile(m.tile, tile)) c += m.type === 'gang' ? 4 : (m.type === 'peng' ? 3 : 0);
  }
  return c;
}

/**
 * calcTai — 台数结算
 * info: { hand, godTiles, seat, zhuangSeat, melds, winType, gangKai, tianhu, dihu, collectedFlowers }
 */
function calcTai(info) {
  const { hand, godTiles, seat, zhuangSeat, melds = [], winType, gangKai = false, tianhu = false, dihu = false, collectedFlowers = [] } = info;
  const details = [];
  let tai = 0;

  // 庄2 平1
  const base = seat === zhuangSeat ? 2 : 1;
  tai += base; details.push(base === 2 ? '庄家 +2台' : '平家 +1台');

  // 自家风头 3/4张 +1
  const seatFeng = { suit: 'feng', num: seat };
  if (countWithMelds(hand, melds, seatFeng) >= 3) { tai += 1; details.push('自家风头 +1台'); }

  // 硬家（中发白）各3/4张 +1
  for (const n of [1, 2, 3]) {
    const jt = { suit: 'jian', num: n };
    if (countWithMelds(hand, melds, jt) >= 3) { tai += 1; details.push('硬家(' + T.tileToString(jt) + ') +1台'); }
  }

  // 硬碰硬：手牌无财神
  if (countGods(hand, godTiles) === 0) { tai += 1; details.push('硬碰硬(无财神) +1台'); }

  // 碰碰胡：无吃，所有面子为刻/杠
  if (!melds.some(m => m.type === 'chi')) {
    // 手牌能否全部分成刻子+将（含财神替）
    const nonGod = hand.filter(t => !isGod(t, godTiles));
    const gods = countGods(hand, godTiles);
    // 枚举将后剩余凑4刻
    const cnt = T.countTiles(nonGod);
    let pong = false;
    for (const [k, v] of cnt) {
      if (v < 2) continue;
      const [suit, num] = k.split('|');
      const rem = removeN(nonGod, { suit, num: parseInt(num, 10) }, 2);
      if (minReplaceMeldsOnlyKong(rem, gods, 4) === 0) { pong = true; break; }
    }
    if (pong && melds.filter(m => m.type === 'peng' || m.type === 'gang').length + 0 >= 0) {
      tai += 1; details.push('碰碰胡 +1台');
    }
  }

  // 杠开
  if (gangKai) { tai += 1; details.push('杠上开花 +1台'); }

  // 齐花/齐季/对座花牌
  const fset = new Set(collectedFlowers.map(f => f.num));
  if ([1, 2, 3, 4].every(n => fset.has(n))) { tai += 1; details.push('齐花(梅兰竹菊) +1台'); }
  if ([5, 6, 7, 8].every(n => fset.has(n))) { tai += 1; details.push('齐季(春夏秋冬) +1台'); }
  const myF = T.flowersForSeat(seat);
  const seatFlower = collectedFlowers.filter(f => myF.includes(f.num)).length;
  if (seatFlower > 0) { tai += seatFlower; details.push('对座花牌 +' + seatFlower + '台'); }

  // 清一色/混一色（财神牌不参与）
  const nonGodSuits = new Set(hand.filter(t => !isGod(t, godTiles)).map(t => t.suit));
  const hasNum = ['wan', 'tong', 'tiao'].some(s => nonGodSuits.has(s));
  if (nonGodSuits.size === 1 && hasNum) {
    tai += 3; details.push('清一色 +3台');
  } else if (hasNum && nonGodSuits.size === 2 && (nonGodSuits.has('feng') || nonGodSuits.has('jian'))) {
    tai += 1; details.push('混一色 +1台');
  }

  if (tianhu) { tai += 4; details.push('天胡 +4台'); }
  if (dihu) { tai += 3; details.push('地胡 +3台'); }

  return { tai, details };
}

/** 只用刻子凑面子（碰碰胡检测用），财神补缺 */
function minReplaceMeldsOnlyKong(tiles, godsLeft, needSets) {
  if (needSets === 0) return tiles.length === 0 ? 0 : WIN_INF;
  if (tiles.length === 0) return godsLeft >= needSets * 3 ? 0 : WIN_INF;
  const first = tiles[0];
  const c = countInHand(tiles, first);
  let best = WIN_INF;
  if (c >= 3) {
    best = Math.min(best, minReplaceMeldsOnlyKong(tiles.slice(c), godsLeft, needSets - 1));
  } else if (godsLeft >= 3 - c) {
    best = Math.min(best, minReplaceMeldsOnlyKong(tiles.slice(c), godsLeft - (3 - c), needSets - 1));
  }
  // 跳过：仅当完全凑不出来时
  best = Math.min(best, 1 + minReplaceMeldsOnlyKong(tiles.slice(c), godsLeft, needSets));
  return best;
}

const RULES = {
  WIN_INF, diceToSeat, buildGodTiles, isGod, countGods, countInHand,
  winReplace, canWin, shanten, winAfterDraw, isSevenPairs, isTenpai, allDrawableTiles,
  canChi, canPeng, canGang, canBuGang, isFlower, calcTai
};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = RULES;
} else {
  window.Rules = RULES;
}
})();

</script>
<script>
/**
 * ai.js — 仙居麻将 AI 决策（人机对战用）
 * 策略：
 *  1. 能胡必胡（canWin）
 *  2. 摸牌后打牌：遍历每种出牌，选向听数(shanten)最小的；同向听时选"孤张/幺九/字牌"优先打出
 *  3. 吃碰杠决策：吃碰后向听数不劣化才吃碰（金碰>财神碰>双夹）；杠若改善牌型则杠
 *  4. 出牌风险：避免打可能被下家碰/杠的熟张（简单启发式）
 */
(function () {


const R = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./rules')
  : (window.Rules || window.rules);
const T = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./tiles')
  : (window.Tiles || window.tiles);

/** 孤张评分：越小越值得打出（单张且无邻牌 → 高分孤立） */
function isolatedScore(hand, tile) {
  if (tile.suit === 'flower') return 99;
  // 字牌单张
  if (tile.suit === 'feng' || tile.suit === 'jian') {
    return T.countInHand(hand, tile) === 1 ? 6 : 2;
  }
  let score = 0;
  // 有同牌对子 → 低孤立（好牌）
  const c = T.countInHand(hand, tile);
  if (c >= 2) score -= 4;
  if (c >= 3) score -= 2;
  // 邻牌加分（不孤立）
  for (const d of [-1, 1]) {
    const n = tile.num + d;
    if (n < 1 || n > 9) continue;
    const nb = T.countInHand(hand, { suit: tile.suit, num: n });
    if (nb > 0) score -= 3 * nb;
  }
  // 幺九略孤
  if (tile.num === 1 || tile.num === 9) score += 1;
  // 财神孤立分置为极低（向听评分已让它天然不被打出，这里再压一档保险）
  return score;
}

/**
 * AI 打牌选择：从手牌中选一张打出
 * @param {Array} hand 摸牌后手牌（14张）
 * @param {Array} godTiles 财神
 * @param {Object} opts { seat, melds }
 * @returns {Object} tile 打出牌
 */
function chooseDiscard(hand, godTiles, opts = {}) {
  if (hand.length === 0) return null;
  // 财神也可以打出；向听评分会自然让财神几乎不被选中（打掉财神向听数大涨），
  // 仅在极端情况（如满手财神）才可能打出
  const candidates = hand.map((t, i) => ({ t, i }));

  let best = null;
  let bestScore = Infinity;
  for (const { t, i } of candidates) {
    const rest = hand.slice(0, i).concat(hand.slice(i + 1));
    const st = R.shanten(rest, godTiles, opts);
    // 主导：向听数越小越好
    // 次要：孤张评分 —— 同向听时打出"最孤立(最高iso)"的牌
    // iso 高=无对子/无邻牌的孤张（该打出）；iso 低=有价值的牌（该保留）
    // 用 st*100 - iso 求最小 → 等价于同向听时取最大 iso
    const iso = isolatedScore(hand, t);
    const score = st * 100 - iso;
    if (score < bestScore) {
      bestScore = score;
      best = { tile: t, index: i, shanten: st, iso };
    }
  }
  return best;
}

/**
 * 吃碰决策：判断是否值得吃/碰
 * @param {String} action 'chi'|'peng'
 * @param {Array} hand 当前手牌
 * @param {Object} discardTile 别人打出的牌
 * @param {Array} godTiles
 * @param {Object} opts { seat, melds }
 * @returns {Boolean}
 */
function wantClaim(action, hand, discardTile, godTiles, opts = {}) {
  const currentSt = R.shanten(hand, godTiles, opts);
  // 吃：真实顺子
  if (action === 'chi') {
    const chis = R.canChi(hand, discardTile, opts.seat, opts.lastDiscardSeat);
    if (chis.length === 0) return false;
    // 模拟吃牌后的向听（吃进 discardTile 形成新面子）
    for (const chi of chis) {
      const need = chi.filter(t => !T.sameTile(t, discardTile));
      const rem = hand.slice();
      for (const nt of need) {
        const idx = rem.findIndex(x => T.sameTile(x, nt));
        if (idx >= 0) rem.splice(idx, 1);
      }
      const newMelds = (opts.melds || []).concat([{ type: 'chi', tile: discardTile }]);
      const st = R.shanten(rem, godTiles, Object.assign({}, opts, { melds: newMelds }));
      if (st < currentSt) return true; // 必须改善才吃
    }
    return false;
  }
  // 碰
  const peng = R.canPeng(hand, discardTile, godTiles);
  if (!peng) return false;
  if (peng.type === 'gold') {
    // 金碰：移除2真牌+1打出，向听改善才碰（除非快胡）
    const rem = hand.slice();
    let removed = 0;
    for (let i = 0; i < rem.length && removed < 2; i++) {
      if (T.sameTile(rem[i], discardTile)) { rem.splice(i, 1); removed++; i--; }
    }
    const newMelds = (opts.melds || []).concat([{ type: 'peng', tile: discardTile }]);
    const st = R.shanten(rem, godTiles, Object.assign({}, opts, { melds: newMelds }));
    return st < currentSt;
  }
  // 财神碰/双夹：消耗财神，要求向听改善
  const gods = R.countGods(hand, godTiles);
  let newHand;
  if (peng.type === 'god') {
    newHand = hand.slice();
    const ti = newHand.findIndex(x => T.sameTile(x, discardTile));
    if (ti >= 0) newHand.splice(ti, 1);
    const gi = newHand.findIndex(x => R.isGod(x, godTiles));
    if (gi >= 0) newHand.splice(gi, 1);
    newHand.push(discardTile);
  } else { // double
    newHand = hand.slice();
    let removed = 0;
    for (let i = 0; i < newHand.length && removed < 2; i++) {
      if (R.isGod(newHand[i], godTiles)) { newHand.splice(i, 1); removed++; i--; }
    }
    newHand.push(discardTile);
  }
  const newMelds = (opts.melds || []).concat([{ type: 'peng', tile: discardTile }]);
  const st = R.shanten(newHand, godTiles, Object.assign({}, opts, { melds: newMelds }));
  return st < currentSt;
}

/**
 * 杠决策
 * 暗杠：杠后移除4张+补1张，若向听不劣化则杠（否则可能拆牌）。
 * 明杠：手3张+打出1张，直接杠。
 * @returns {Boolean}
 */
function wantGang(hand, tile, godTiles, opts = {}) {
  if (!tile) return false;
  // 暗杠：移除4张（多摸1张）
  if (!tile.isDiscard) {
    const rem = hand.filter(t => !T.sameTile(t, tile));
    // 杠后向听（手牌少了4张但补1张未知，用3张刻子的向听近似）
    const melds = (opts.melds || []).concat([{ type: 'gang', tile }]);
    const st = R.shanten(rem, godTiles, Object.assign({}, opts, { melds }));
    // 暗杠几乎总是有利（补牌机会），除非杠后向听远劣化（如4张是唯一面子核心）
    return st <= R.shanten(hand, godTiles, opts) + 1;
  }
  return true; // 明杠：稳定 +1 面子，直接杠
}

/** 摸到花牌 → 返回 true（由 game 层补牌） */
function onFlower() { return true; }

const AI = { chooseDiscard, wantClaim, wantGang, isolatedScore, onFlower };

if (typeof module !== 'undefined' && module.exports) {
  module.exports = AI;
} else {
  window.AI = AI;
}
})();

</script>
<script>
/**
 * game.js — 仙居麻将 对局状态机（人机对战）
 *
 * 座位：1东(玩家) 2南 3西 4北，行牌方向 1→2→3→4→1（逆时针）
 * 上家 = ((seat+2)%4)+1（给 seat 喂牌的玩家）
 *
 * 流程：
 *  start() → 洗牌/发牌/定庄/翻财神/补花 → 逐回合：
 *   [当前家] 摸牌 → 若花循环补花 → 可自摸胡 / 暗杠 → 打牌
 *   [其他家] 可 吃(仅上家)/碰/杠/胡(点炮) → 逆时针近者优先
 * 结算：自摸三家各付(台数)；点炮者付(台数×2)；封顶可配
 */
(function () {


const T = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./tiles')
  : (window.Tiles || window.tiles);
const R = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./rules')
  : (window.Rules || window.rules);
const AI = (typeof require === 'function' && typeof module !== 'undefined' && module.exports)
  ? require('./ai')
  : (window.AI || window.ai);

const SEATS = [1, 2, 3, 4];

class Game {
  /**
   * @param {Object} opts {
   *   humanSeat: 1（玩家固定东），
   *   bottom: 底分（默认1），
   *   cap: 封顶台数（默认0=不封顶），
   *   onUpdate: (snapshot)=>void，每步更新回调,
   *   thinkDelayMs: (seat, kind:'discard'|'claim')=>ms 人机行动延迟（默认 0=立即，测试用）,
   *   humanTimeoutMs: 人类出牌倒计时（默认 0=不限时；>0 时超时随机打出一张）,
   * }
   */
  constructor(opts = {}) {
    this.humanSeat = opts.humanSeat || 1;
    this.bottom = opts.bottom || 1;
    this.cap = opts.cap || 0;
    this.onUpdate = opts.onUpdate || (() => {});
    this.thinkDelayMs = typeof opts.thinkDelayMs === 'function' ? opts.thinkDelayMs : (() => 0);
    this.humanTimeoutMs = opts.humanTimeoutMs || 0;
    this.thinkTimer = null;
    this.thinkInfo = null;
    this.log = [];
    this.reset();
  }

  reset() {
    this.clearThink();
    this.players = SEATS.map(seat => ({
      seat,
      hand: [],        // 手牌（花牌摊开后仍从手牌移出）
      melds: [],       // {type:'chi'|'peng'|'gang'|'bugang', tile, tiles?, isAn?}
      flowers: [],     // 摸到的花牌（摊开放自己面前）
      isHuman: seat === this.humanSeat,
      huInfo: null,    // 胡牌记录
      score: 0,        // 本局得分
      gangKai: false,
    }));
    this.deck = [];
    this.discards = [];       // {seat, tile}
    this.godTiles = [];
    // 庄家：若有预设轮庄值沿用（nextRound 设置）；否则默认玩家先做庄
    if (this._nextZhuang) { this.zhuangSeat = this._nextZhuang; this._nextZhuang = 0; }
    else { this.zhuangSeat = this.humanSeat; }
    this.dice = 0;
    this.currentSeat = 0;
    this.phase = 'idle';      // idle|draw|discard|claim|over
    this.lastDiscard = null;  // {seat, tile}
    this.pendingClaims = [];  // 当前可声明集合
    this.wallLeft = 0;
    this.turnCount = 0;
    this.roundInfo = null;    // 结算信息
    this.winnerSeat = 0;
    this.drawGame = false;
    this.needChiChoice = null; // 待玩家选择吃法
    this.autoPassTimer = null;
    this.gangKaiSeat = 0;      // 刚杠完的座位（杠后补牌标记）
  }

  /** 记录日志 */
  pushLog(msg) {
    this.log.push({ turn: this.turnCount, msg });
    // console.log('[game]', msg);
  }

  /** 清空待执行的人机思考计时器（重新开局/销毁时调用） */
  clearThink() {
    if (this.thinkTimer) { clearTimeout(this.thinkTimer); this.thinkTimer = null; }
    this.thinkInfo = null;
  }

  /** 销毁：防止旧对局的延迟回调污染新对局 */
  destroy() { this.clearThink(); this.onUpdate = () => {}; }

  /**
   * 行动延迟调度：
   * - kind='discard'（出牌）：统一 20s 倒计时窗口（until = 开始+20s），
   *   fn 在窗口内随机时刻触发（ms 由 thinkDelayMs 给）→ 倒计时 20~1s 之间随机出牌
   * - kind='claim'（声明）：短思考，倒计时即实际时长
   * thinkInfo={seat,kind,startedAt,until} 随快照给 UI 显示倒计时
   */
  _scheduleThink(seat, kind, fn) {
    if (this.thinkTimer) return; // 已有待执行的行动调度（嵌套 autoRun 帧重复触发），忽略重复调度
    const ms = Math.max(0, Math.round(Number(this.thinkDelayMs(seat, kind)) || 0));
    if (ms <= 0) { fn(); return; }
    const now = Date.now();
    const budget = (kind === 'discard') ? 20000 : ms;
    this.thinkInfo = { seat, kind, startedAt: now, until: now + budget };
    this.emit();
    this.thinkTimer = setTimeout(() => {
      this.thinkTimer = null;
      this.thinkInfo = null;
      fn();
    }, ms);
  }

  /** 人类出牌倒计时：humanTimeoutMs 内未出牌 → 随机打出一张（优先非财神） */
  _scheduleHumanDiscardTimer() {
    if (!this.humanTimeoutMs) return;
    if (this.thinkTimer) return; // 防重复调度（嵌套 autoRun 帧）
    const now = Date.now();
    this.thinkInfo = { seat: this.humanSeat, kind: 'discard', startedAt: now, until: now + this.humanTimeoutMs };
    this.thinkTimer = setTimeout(() => {
      this.thinkTimer = null;
      this.thinkInfo = null;
      if (this.phase !== 'waitHumanDiscard') return;
      const p = this.getPlayer(this.humanSeat);
      // 超时随机打出一张（财神也可能被打出）
      const idx = Math.floor(Math.random() * p.hand.length);
      this.pushLog('超时未出牌，随机打出 ' + T.tileToString(p.hand[idx]));
      this.humanDiscard(idx);
    }, this.humanTimeoutMs);
  }

  /** 生成快照给 UI */
  snapshot() {
    return {
      players: this.players.map(p => ({
        seat: p.seat,
        isHuman: p.isHuman,
        handCount: p.hand.length,
        hand: p.isHuman ? p.hand.slice() : null,
        melds: p.melds.map(m => Object.assign({}, m)),
        flowers: p.flowers.map(f => Object.assign({}, f)),
        isDealer: p.seat === this.zhuangSeat,
        score: p.score,
        huInfo: p.huInfo,
      })),
      discards: this.discards.map(d => Object.assign({}, d)),
      godTiles: this.godTiles.map(g => Object.assign({}, g)),
      zhuangSeat: this.zhuangSeat,
      dice: this.dice,
      currentSeat: this.currentSeat,
      phase: this.phase,
      lastDiscard: this.lastDiscard ? Object.assign({}, this.lastDiscard) : null,
      wallLeft: this.deck.length,
      winnerSeat: this.winnerSeat,
      drawGame: this.drawGame,
      roundInfo: this.roundInfo,
      pendingClaims: this.pendingClaims.map(c => Object.assign({}, c)),
      needChiChoice: this.needChiChoice,
      turnCount: this.turnCount,
      log: this.log.slice(-6),
      // 人机思考倒计时（无则为 null）
      thinking: this.thinkInfo ? { seat: this.thinkInfo.seat, kind: this.thinkInfo.kind, startedAt: this.thinkInfo.startedAt, until: this.thinkInfo.until } : null,
    };
  }

  /** 通知 UI */
  emit() { this.onUpdate(this.snapshot()); }

  /* ============ 开局 ============ */

  start() {
    this.reset();
    // 洗牌
    this.deck = T.shuffle(T.createDeck(true));
    // 掷骰 + 翻财神
    const d1 = 1 + Math.floor(Math.random() * 6);
    const d2 = 1 + Math.floor(Math.random() * 6);
    this.dice = d1 + d2;
    // 翻牌财神：从牌墙尾部取一张亮出（不放回），财神=风头4张+该牌型剩余3张=7张
    const flipped = this.deck.pop();
    this.godTiles = R.buildGodTiles(this.zhuangSeat, this.dice, flipped);
    this.pushLog('掷骰 ' + this.dice + '，财神：' + T.tileToString({ suit: 'feng', num: R.diceToSeat(this.dice) }) + ' + ' + T.tileToString(flipped) + '（翻牌）');

    // 发牌：庄14，闲13
    for (const seat of SEATS) {
      const n = seat === this.zhuangSeat ? 14 : 13;
      const p = this.getPlayer(seat);
      for (let i = 0; i < n; i++) p.hand.push(this.deck.pop());
    }
    // 全场补花（循环）
    for (const seat of SEATS) this.buHua(seat, true);
    // 庄家天胡检测
    const zhuang = this.getPlayer(this.zhuangSeat);
    if (R.canWin(zhuang.hand, this.godTiles, { seat: this.zhuangSeat, melds: zhuang.melds })) {
      this.pushLog('庄家天胡！');
      return this.finish(zhuang.seat, 'tianhu', zhuang.hand.slice(), null, true);
    }
    this.currentSeat = this.zhuangSeat;
    this.phase = 'discard';
    this.pushLog('开局：庄家 ' + this.seatName(this.zhuangSeat) + ' 请打牌');
    this.emit();
    this.autoRun();
  }

  getPlayer(seat) { return this.players.find(p => p.seat === seat); }
  seatName(seat) { return T.FENG_NAMES[seat - 1] + '家'; }

  /** 补花：手中有花牌则摊开并补牌（循环） */
  buHua(seat, isStart = false) {
    const p = this.getPlayer(seat);
    let count = 0;
    while (true) {
      const fi = p.hand.findIndex(t => t.suit === 'flower');
      if (fi < 0) break;
      const flower = p.hand.splice(fi, 1)[0];
      p.flowers.push(flower);
      count++;
      if (this.deck.length === 0) break;
      p.hand.push(this.deck.pop()); // 从尾部补牌
    }
    if (count > 0) {
      this.pushLog(this.seatName(seat) + ' 补花 ' + count + ' 张');
    }
    return count;
  }

  /* ============ 回合推进 ============ */

  /** 自动运行：非玩家回合或无需玩家决策时持续推进（AI 行动经思考延迟调度） */
  autoRun() {
    if (this.thinkTimer) return; // 有 AI 正在思考，等计时器回调
    while (this.phase !== 'over' && this.phase !== 'waitHumanDiscard' && this.phase !== 'waitHumanClaim' && this.phase !== 'waitHumanChi') {
      const before = this.phase;
      if (this.phase === 'discard') {
        const seat = this.currentSeat;
        const p = this.getPlayer(seat);
        if (p.isHuman) {
          this.phase = 'waitHumanDiscard';
          this._scheduleHumanDiscardTimer(); // 人类出牌倒计时（超时随机打出）
          this.emit();
          break;
        } else {
          // AI 打牌：随机思考倒计时（延迟 0 时同步执行，保持测试即时性）
          this._scheduleThink(seat, 'discard', () => this.aiDiscard(seat));
          return;
        }
      } else if (this.phase === 'draw') {
        this.doDraw(this.currentSeat);
      } else if (this.phase === 'claim') {
        this.processClaims();
        if (this.thinkTimer) return; // AI 声明进入思考
      } else {
        break;
      }
      if (this.phase === before) break; // 防死循环
    }
  }

  /** 摸牌（当前家） */
  doDraw(seat) {
    if (this.deck.length === 0) { this.drawGame = true; this.pushLog('牌墙摸完，流局'); return this.finish(0, 'draw', null, null, false); }
    const p = this.getPlayer(seat);
    const tile = this.deck.pop();
    p.hand.push(tile);
    p.gangKai = this.gangKaiSeat === seat; // 杠后摸的牌标记
    this.pushLog(this.seatName(seat) + ' 摸牌 ' + (p.isHuman ? T.tileToString(tile) : ''));
    // 补花
    if (tile.suit === 'flower') {
      // 摸到花牌：摊开并从牌墙尾部补牌（buHua 内部处理循环补花）
      this.buHua(seat);
      this.pushLog(this.seatName(seat) + ' 摸到花牌补花');
      // 补花后手牌数量回到 13（若补到花则继续补），重新检测自摸/暗杠
      if (this.deck.length === 0) { this.drawGame = true; return this.finish(0, 'draw', null, null, false); }
      if (R.canWin(p.hand, this.godTiles, { seat, melds: p.melds })) {
        this.pushLog(this.seatName(seat) + ' 补花后自摸胡！');
        return this.finish(seat, 'self', p.hand.slice(), null, false);
      }
      this.phase = 'discard';
      this.emit();
      this.autoRun();
      return;
    }
    // 自摸胡检测
    if (R.canWin(p.hand, this.godTiles, { seat, melds: p.melds })) {
      this.pushLog(this.seatName(seat) + ' 自摸胡！');
      return this.finish(seat, 'self', p.hand.slice(), null, false);
    }
    // 暗杠检测（玩家可决策，AI 自动）
    this.phase = 'discard';
    this.emit();
    this.autoRun();
  }

  /** AI 打牌 */
  aiDiscard(seat) {
    const p = this.getPlayer(seat);
    // 暗杠决策
    const anGang = R.canGang(p.hand, null, this.godTiles);
    if (anGang && AI.wantGang(p.hand, { ...anGang.tile, isDiscard: false }, this.godTiles, { seat })) {
      this.doAnGang(seat, anGang.tile);
      return;
    }
    const decision = AI.chooseDiscard(p.hand, this.godTiles, { seat, melds: p.melds });
    if (!decision) return;
    this.doDiscard(seat, decision.index);
  }

  /** 执行打牌 */
  doDiscard(seat, index) {
    const p = this.getPlayer(seat);
    if (index < 0 || index >= p.hand.length) return;
    const tile = p.hand.splice(index, 1)[0];
    this.discards.push({ seat, tile });
    this.lastDiscard = { seat, tile };
    p.gangKai = false;
    this.gangKaiSeat = 0;
    this.pushLog(this.seatName(seat) + ' 打出 ' + T.tileToString(tile));
    // 检查其他家声明（吃/碰/杠/胡）
    this.gatherClaims(seat, tile);
    if (this.pendingClaims.length === 0) {
      this.nextTurn(seat);
    } else {
      this.phase = 'claim';
      this.emit();
      this.autoRun();
    }
  }

  /** 收集声明：逆时针（seat+1 开始）依次检查胡/碰/杠/吃 */
  gatherClaims(discardSeat, tile) {
    this.pendingClaims = [];
    // 财神打出入河为废：不能被吃/碰/杠/胡
    if (R.isGod(tile, this.godTiles)) return;
    const order = [];
    for (let i = 1; i <= 3; i++) order.push(((discardSeat + i - 1) % 4) + 1);
    // 胡牌优先收集（截胡规则：逆时针近者优先）
    const winClaims = [];
    for (const seat of order) {
      const p = this.getPlayer(seat);
      if (p.huInfo) continue;
      if (R.canWin(p.hand.concat([tile]), this.godTiles, { seat, melds: p.melds })) {
        winClaims.push({ seat, action: 'hu', priority: order.indexOf(seat) });
      }
    }
    // 非胡声明
    const otherClaims = [];
    for (const seat of order) {
      const p = this.getPlayer(seat);
      if (p.huInfo) continue;
      if (winClaims.some(c => c.seat === seat)) continue;
      // 已有 4 个面子 → 只能胡，不能再吃碰杠
      if (p.melds.length >= 4) continue;
      const peng = R.canPeng(p.hand, tile, this.godTiles);
      const gang = R.canGang(p.hand, tile, this.godTiles);
      const chi = R.canChi(p.hand, tile, seat, discardSeat);
      const list = [];
      if (peng) list.push({ seat, action: 'peng', type: peng.type });
      if (gang) list.push({ seat, action: 'gang', type: gang.type });
      if (chi.length > 0) list.push({ seat, action: 'chi', variants: chi.length });
      for (const c of list) otherClaims.push(c);
    }
    this.pendingClaims = winClaims.concat(otherClaims);
  }

  /** 处理声明（AI 决策先经思考延迟，玩家等待输入） */
  processClaims() {
    if (this.pendingClaims.length === 0) { return; }
    // 防御：如果 lastDiscard 已被消费（某声明已执行），直接清空回到正常流程
    if (!this.lastDiscard) {
      this.pendingClaims = [];
      this.phase = 'draw';
      this.emit();
      this.autoRun();
      return;
    }
    // 找当前轮次最先应该处理的：胡 > 其他；同优先级的胡优先
    const humanClaims = this.pendingClaims.filter(c => this.getPlayer(c.seat).isHuman);
    if (humanClaims.length > 0) {
      this.phase = 'waitHumanClaim';
      this.emit();
      return;
    }
    // AI 声明：随机思考倒计时后再决策（胡牌也会有"长考后胡牌"的张力）
    const first = this.pendingClaims[0];
    this._scheduleThink(first.seat, 'claim', () => this._aiProcessClaims());
  }

  /** AI 声明决策（思考倒计时结束后执行） */
  _aiProcessClaims() {
    for (const claim of this.pendingClaims) {
      const p = this.getPlayer(claim.seat);
      if (claim.action === 'hu') { // 必胡
        this.doHu(claim.seat, this.lastDiscard.tile, 'discard');
        return;
      }
      if (claim.action === 'peng') {
        if (AI.wantClaim('peng', p.hand, this.lastDiscard.tile, this.godTiles, { seat: claim.seat, melds: p.melds, lastDiscardSeat: this.lastDiscard.seat })) {
          this.doPeng(claim.seat, this.lastDiscard.tile);
          return;
        }
      } else if (claim.action === 'gang') {
        this.doGang(claim.seat, this.lastDiscard.tile);
        return;
      } else if (claim.action === 'chi') {
        if (AI.wantClaim('chi', p.hand, this.lastDiscard.tile, this.godTiles, { seat: claim.seat, melds: p.melds, lastDiscardSeat: this.lastDiscard.seat })) {
          const chis = R.canChi(p.hand, this.lastDiscard.tile, claim.seat, this.lastDiscard.seat);
          this.doChi(claim.seat, this.lastDiscard.tile, chis[0]);
          return;
        }
      }
    }
    // 无人声明 → 过
    this.claimsPassed();
  }

  /** 所有声明被放弃 → 下家摸牌 */
  claimsPassed() {
    this.pendingClaims = [];
    this.lastDiscard = null;
    const nextSeat = ((this.currentSeat) % 4) + 1;
    this.currentSeat = nextSeat;
    this.turnCount++;
    this.phase = 'draw';
    this.emit();
    this.autoRun();
  }

  /** 下家摸牌 */
  nextTurn(discardSeat) {
    this.pendingClaims = [];
    const nextSeat = (discardSeat % 4) + 1;
    this.currentSeat = nextSeat;
    this.turnCount++;
    this.phase = 'draw';
    this.emit();
    this.autoRun();
  }

  /* ============ 声明执行 ============ */

  doPeng(seat, tile) {
    const p = this.getPlayer(seat);
    // 从手牌移除2张真牌（或1真1财神/2财神）
    const peng = R.canPeng(p.hand, tile, this.godTiles);
    let removed = 0;
    if (peng.type === 'gold') {
      for (let i = 0; i < p.hand.length && removed < 2; i++) {
        if (T.sameTile(p.hand[i], tile)) { p.hand.splice(i, 1); removed++; i--; }
      }
    } else if (peng.type === 'god') {
      const ti = p.hand.findIndex(x => T.sameTile(x, tile));
      if (ti >= 0) p.hand.splice(ti, 1);
      const gi = p.hand.findIndex(x => R.isGod(x, this.godTiles));
      if (gi >= 0) p.hand.splice(gi, 1);
    } else { // double
      for (let i = 0; i < p.hand.length && removed < 2; i++) {
        if (R.isGod(p.hand[i], this.godTiles)) { p.hand.splice(i, 1); removed++; i--; }
      }
    }
    p.melds.push({ type: 'peng', tile: Object.assign({}, tile), claimType: peng.type });
    this.removeDiscard(tile);
    this.pushLog(this.seatName(seat) + ' 碰 ' + T.tileToString(tile) + '（' + (peng.type === 'gold' ? '金碰' : peng.type === 'god' ? '财神碰' : '双夹') + '）');
    this.currentSeat = seat;
    this.phase = 'discard';
    this.emit();
    this.autoRun();
  }

  doChi(seat, tile, chiTiles) {
    const p = this.getPlayer(seat);
    // 从手牌移除顺子中非打出牌的两张
    const need = chiTiles.filter(t => !T.sameTile(t, tile));
    for (const nt of need) {
      const idx = p.hand.findIndex(x => T.sameTile(x, nt));
      if (idx >= 0) p.hand.splice(idx, 1);
    }
    p.melds.push({ type: 'chi', tile: Object.assign({}, tile), tiles: chiTiles.map(t => Object.assign({}, t)) });
    this.removeDiscard(tile);
    this.pushLog(this.seatName(seat) + ' 吃 ' + chiTiles.map(T.tileToString).join(''));
    this.currentSeat = seat;
    this.phase = 'discard';
    this.emit();
    this.autoRun();
  }

  doGang(seat, tile) {
    // 明杠：手牌3张 + 打出1张
    const p = this.getPlayer(seat);
    let removed = 0;
    for (let i = 0; i < p.hand.length && removed < 3; i++) {
      if (T.sameTile(p.hand[i], tile)) { p.hand.splice(i, 1); removed++; i--; }
    }
    p.melds.push({ type: 'gang', tile: Object.assign({}, tile), isAn: false });
    this.removeDiscard(tile);
    this.gangKaiSeat = seat;
    this.pushLog(this.seatName(seat) + ' 明杠 ' + T.tileToString(tile));
    this.afterGang(seat);
  }

  doAnGang(seat, tile) {
    const p = this.getPlayer(seat);
    let removed = 0;
    for (let i = 0; i < p.hand.length && removed < 4; i++) {
      if (T.sameTile(p.hand[i], tile)) { p.hand.splice(i, 1); removed++; i--; }
    }
    p.melds.push({ type: 'gang', tile: Object.assign({}, tile), isAn: true });
    this.gangKaiSeat = seat;
    this.pushLog(this.seatName(seat) + ' 暗杠 ' + T.tileToString(tile));
    this.afterGang(seat);
  }

  /** 杠后补牌（从牌墙尾部），补花循环；自摸胡检测 */
  afterGang(seat) {
    const p = this.getPlayer(seat);
    this.pendingClaims = []; // 杠已执行，清空所有残留声明
    if (this.deck.length === 0) { this.drawGame = true; return this.finish(0, 'draw', null, null, false); }
    const tile = this.deck.pop();
    p.hand.push(tile);
    p.gangKai = true;
    this.pushLog(this.seatName(seat) + ' 杠后补牌');
    if (tile.suit === 'flower') {
      this.buHua(seat);
      this.pushLog(this.seatName(seat) + ' 补花');
      if (this.deck.length === 0) { this.drawGame = true; return this.finish(0, 'draw', null, null, false); }
      // 补花后回到打牌回合（补花补进的牌也可能自摸）
      if (R.canWin(p.hand, this.godTiles, { seat, melds: p.melds })) {
        this.pushLog(this.seatName(seat) + ' 杠后补花自摸！');
        return this.finish(seat, 'self', p.hand.slice(), null, false, true);
      }
      this.phase = 'discard';
      this.emit(); this.autoRun();
      return;
    }
    // 杠上开花
    if (R.canWin(p.hand, this.godTiles, { seat, melds: p.melds })) {
      this.pushLog(this.seatName(seat) + ' 杠上开花自摸！');
      return this.finish(seat, 'self', p.hand.slice(), null, false, true);
    }
    this.phase = 'discard';
    this.emit();
    this.autoRun();
  }

  /** 胡牌 */
  doHu(seat, tile, type, gangKai = false) {
    const p = this.getPlayer(seat);
    const hand14 = type === 'self' ? p.hand.slice() : p.hand.concat([tile]);
    // 记录放炮者（点炮胡结算用）
    this.huPayerSeat = 0;
    if (type === 'discard' && this.lastDiscard) {
      this.huPayerSeat = this.lastDiscard.seat;
      this.removeDiscard(tile);
    }
    this.pushLog(this.seatName(seat) + ' 胡牌！');
    this.finish(seat, type, hand14, tile, false, gangKai);
  }

  removeDiscard(tile) {
    const idx = this.discards.findIndex(d => d.seat === this.lastDiscard.seat && T.sameTile(d.tile, tile));
    if (idx >= 0) this.discards.splice(idx, 1);
    this.lastDiscard = null;
  }

  /* ============ 结算 ============ */

  /**
   * finish(winnerSeat, winType, hand14, winTile, tianhu, gangKai)
   */
  finish(winnerSeat, winType, hand14, winTile, tianhu = false, gangKai = false) {
    this.phase = 'over';
    this.winnerSeat = winnerSeat;
    this.roundInfo = null;
    if (winType === 'draw') { this.drawGame = true; this.emit(); return; }

    const winner = this.getPlayer(winnerSeat);
    const melds = winner.melds;
    // 地胡：闲家第一轮摸牌胡
    let dihu = false;
    if (winType === 'self' && winnerSeat !== this.zhuangSeat && this.turnCount <= 1 && melds.length === 0) {
      dihu = true;
    }
    const info = {
      hand: hand14, godTiles: this.godTiles, seat: winnerSeat, zhuangSeat: this.zhuangSeat,
      melds, winType, gangKai: gangKai || winner.gangKai,
      tianhu, dihu, collectedFlowers: winner.flowers,
    };
    const taiRes = R.calcTai(info);
    let tai = taiRes.tai;
    if (this.cap > 0 && tai > this.cap) tai = this.cap;

    // 分差：自摸三家付；点炮点炮者付2倍
    let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
    if (winType === 'self') {
      for (const s of SEATS) {
        if (s === winnerSeat) continue;
        const pay = tai * this.bottom;
        scores[s] -= pay;
        scores[winnerSeat] += pay;
      }
    } else {
      const payer = this.huPayerSeat || 0;
      if (payer && payer !== winnerSeat) {
        const pay = tai * 2 * this.bottom;
        scores[payer] -= pay;
        scores[winnerSeat] += pay;
      }
    }
    for (const s of SEATS) this.getPlayer(s).score += scores[s];

    winner.huInfo = {
      winType, tai, details: taiRes.details,
      hand: hand14.map(T.tileToString),
      handRaw: hand14.map(t => ({ suit: t.suit, num: t.num })),
      meldsRaw: melds.map(m => Object.assign({}, m)),
      winTile: winTile ? T.tileToString(winTile) : null,
      tianhu, dihu, gangKai: gangKai || winner.gangKai,
    };
    this.roundInfo = {
      winnerSeat, winnerName: this.seatName(winnerSeat),
      winType, tai, details: taiRes.details, scores,
      isHumanWin: winnerSeat === this.humanSeat,
    };
    this.emit();
  }

  /* ============ 玩家交互 ============ */

  /** 玩家摸牌后打牌（选择手牌index；财神也可以打出） */
  humanDiscard(index) {
    if (this.phase !== 'waitHumanDiscard') return;
    this.clearThink(); // 打出即取消本回合倒计时
    const p = this.getPlayer(this.humanSeat);
    if (index < 0 || index >= p.hand.length) return;
    this.doDiscard(this.humanSeat, index);
  }

  /** 玩家声明决策 */
  humanClaim(action) {
    if (this.phase !== 'waitHumanClaim') return;
    const myClaim = this.pendingClaims.find(c => c.seat === this.humanSeat);
    if (!myClaim) return;
    if (action === 'hu') {
      this.doHu(this.humanSeat, this.lastDiscard.tile, 'discard');
    } else if (action === 'peng') {
      this.doPeng(this.humanSeat, this.lastDiscard.tile);
    } else if (action === 'gang') {
      this.doGang(this.humanSeat, this.lastDiscard.tile);
    } else if (action === 'chi') {
      const chis = R.canChi(this.getPlayer(this.humanSeat).hand, this.lastDiscard.tile, this.humanSeat, this.lastDiscard.seat);
      if (chis.length > 0) {
        this.needChiChoice = chis;
        this.phase = 'waitHumanChi';
        this.emit();
      } else {
        // 无有效吃法 → 按过处理
        this.pendingClaims = this.pendingClaims.filter(c => c.seat !== this.humanSeat);
        this.claimsPassedCheck();
      }
    } else if (action === 'pass') {
      this.pendingClaims = this.pendingClaims.filter(c => c.seat !== this.humanSeat);
      this.claimsPassedCheck();
    }
  }

  /** 玩家选择吃法 */
  humanChiVariant(v) {
    if (this.phase !== 'waitHumanChi' || !this.needChiChoice) return;
    const chis = this.needChiChoice;
    this.needChiChoice = null;
    this.doChi(this.humanSeat, this.lastDiscard.tile, chis[v]);
  }

  /** 玩家放弃所有声明 */
  claimsPassedCheck() {
    if (this.pendingClaims.length === 0) {
      this.claimsPassed();
    } else {
      // 还有AI声明则让AI处理
      this.phase = 'claim';
      this.emit();
      this.autoRun();
    }
  }

  /** 玩家暗杠 */
  humanAnGang() {
    if (this.phase !== 'waitHumanDiscard') return;
    this.clearThink(); // 消耗本回合（杠后重新进入出牌倒计时）
    const p = this.getPlayer(this.humanSeat);
    const anGang = R.canGang(p.hand, null, this.godTiles);
    if (anGang) {
      this.doAnGang(this.humanSeat, anGang.tile);
    }
  }

  /** 玩家补杠 */
  humanBuGang() {
    if (this.phase !== 'waitHumanDiscard') return;
    this.clearThink(); // 消耗本回合（杠后重新进入出牌倒计时）
    const p = this.getPlayer(this.humanSeat);
    // 找手牌中能与碰牌组成补杠的牌
    for (const m of p.melds) {
      if (m.type === 'peng' && T.countInHand(p.hand, m.tile) >= 1) {
        const idx = p.hand.findIndex(x => T.sameTile(x, m.tile));
        p.hand.splice(idx, 1);
        p.melds = p.melds.map(x => x === m ? { type: 'bugang', tile: m.tile } : x);
        this.gangKaiSeat = this.humanSeat;
        this.pushLog(this.seatName(this.humanSeat) + ' 补杠 ' + T.tileToString(m.tile));
        this.afterGang(this.humanSeat);
        return;
      }
    }
  }

  /** 下一局（轮庄） */
  nextRound() {
    // 庄家轮转：流局/胡牌都顺时针换庄（简化规则）
    const prev = this.zhuangSeat || this.humanSeat;
    this._nextZhuang = (prev % 4) + 1;
    for (const p of this.players) { p.score = 0; p.huInfo = null; }
    this.start();
  }
}

// Node / 浏览器双端
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { Game, SEATS };
} else {
  window.Game = Game;
}
})();

</script>
<script>
/**
 * ui.js — 仙居麻将 UI 控制器（浏览器端）
 * 渲染牌桌、处理玩家交互、驱动 Game 状态机
 */

(function () {
  const T = window.Tiles;
  const R = window.Rules;
  const AI = window.AI;
  const GameClass = window.Game;

  let game = null;
  let selectedIdx = -1;      // 玩家选中的手牌下标
  let claimCandidates = [];  // 待玩家决策的声明
  let thinking = false;      // AI 思考中(防止连点)

  const $ = (id) => document.getElementById(id);

  /* ============ 牌面渲染（Wikimedia Commons 官方牌面素材） ============ */
  // 素材：assets/tiles/MJ*.svg —— 维基百科同款麻将牌面（作者 Cangjie6，CC BY-SA 4.0）
  // 出处与授权见 assets/tiles/ATTRIBUTION.md
  // 本地命名即游戏编号：
  //   MJw1-9 万子 / MJt1-9 筒子 / MJs1-9 条子 / MJf1-4 東南西北 / MJd1-3 中發白
  //   MJh1-8 梅兰竹菊春夏秋冬 / MJback 牌背
  const TILE_DIR = 'assets/tiles/';
  const TILE_PREFIX = { wan: 'MJw', tong: 'MJt', tiao: 'MJs', feng: 'MJf', jian: 'MJd', flower: 'MJh' };

  /** 牌 → 素材文件路径 */
  function tileImgSrc(t) {
    const name = TILE_PREFIX[t.suit] + t.num + '.svg';
    return (window.__TILE_DATA && window.__TILE_DATA[name]) || (TILE_DIR + name);
  }

  /** 根据花色返回 CSS 类 */
  function tileClass(t, extra) {
    let cls = 'tile';
    if (extra) cls += ' ' + extra;
    if (t.suit === 'flower') cls += ' flower-bg';
    if (t.__god) cls += ' god-mark';
    return cls;
  }

  /** 创建牌 DOM 元素（Wikimedia 官方牌面图片） */
  function makeTileEl(t, opts = {}) {
    const el = document.createElement('div');
    el.className = tileClass(t, opts.extra);
    if (opts.small) el.classList.add('small');
    if (opts.tiny) el.classList.add('tiny');
    el.innerHTML = `<img class="tile-img" src="${tileImgSrc(t)}" alt="" draggable="false">`;
    return el;
  }

  /** 花色排序函数 */
  function suitOrder(t) {
    const order = { wan:0, tong:1, tiao:2, feng:3, jian:4, flower:5 };
    return (order[t.suit]||6) * 100 + t.num;
  }

  /* ============ 快照渲染 ============ */

  function render(snap) {
    // 财神标记
    $('god-tag').textContent = '财神: ' + snap.godTiles.map(T.tileToString).join(' ');
    $('wall-info').textContent = '牌墙 ' + snap.wallLeft;
    const me = snap.players.find(p => p.isHuman);
    const dealer = snap.players.find(p => p.seat === snap.zhuangSeat);
    $('dealer-tag').textContent = '庄家 ' + (dealer ? T.FENG_NAMES[dealer.seat-1] : '') + '家';

    // 显示当前行动提示
    const cur = snap.players.find(p => p.seat === snap.currentSeat);
    const PHASE_HINT = {
      waitHumanDiscard: '轮到你（双击/出牌）',
      waitHumanClaim: '碰/杠/胡/过？',
      waitHumanChi: '吃 / 过？',
    };
    $('turn-info').textContent = snap.phase === 'over' ? ''
      : (PHASE_HINT[snap.phase] || ((cur && cur.isHuman) ? '轮到你' : (cur ? T.FENG_NAMES[cur.seat - 1] + '家思考中' : '')));

    // 三家（2南 3西 4北）
    for (const seat of [2, 3, 4]) {
      const p = snap.players.find(x => x.seat === seat);
      if (!p) continue;
      const opp = $('opp-' + seat);
      if (!opp) continue;
      const nameEl = opp.querySelector('.seat-name');
      if (nameEl) {
        nameEl.textContent = T.FENG_NAMES[seat-1] + '家' + (p.isDealer ? '·庄' : '');
      }
      const tilesEl = opp.querySelector('.opp-tiles');
      if (tilesEl) tilesEl.textContent = p.handCount + ' 张';
      const meldEl = opp.querySelector('.opp-melds');
      if (meldEl) meldEl.textContent = p.melds.map(m => {
        if (m.type === 'gang') return (m.isAn ? '暗杠' : '杠') + T.tileToString(m.tile);
        if (m.type === 'peng') return '碰' + T.tileToString(m.tile);
        if (m.type === 'chi') return '吃' + (m.tile ? T.tileToString(m.tile) : '');
        return '';
      }).join(' ');
      const flowerEl = opp.querySelector('.opp-flowers');
      if (flowerEl) flowerEl.textContent = p.flowers.length ? '🌸×' + p.flowers.length : '';
      // 背面手牌
      const handEl = $('hand-' + seat);
      if (handEl) {
        handEl.innerHTML = '';
        const recentIdx = snap.lastDiscard && snap.lastDiscard.seat === seat ? snap.discards.length - 1 : -1;
        for (let i = 0; i < p.handCount; i++) {
          const back = document.createElement('div');
          back.className = 'back-tile';
          if (recentIdx >= 0 && i === p.handCount - 1) back.classList.add('recent');
          handEl.appendChild(back);
        }
      }
    }

    // 弃牌堆：每家的牌排在自己面前（#discard-1 我下 / 2 南右 / 3 西上 / 4 北左）
    // 全场最新打出且未被吃碰杠消费的牌 → 红圈圈注，直到下一张牌打出
    const latest = snap.discards && snap.discards.length ? snap.discards[snap.discards.length - 1] : null;
    for (const seat of [1, 2, 3, 4]) {
      const pile = $('discard-' + seat);
      if (!pile) continue;
      pile.innerHTML = '';
      const discs = snap.discards.filter(d => d.seat === seat);
      discs.forEach((d, di) => {
        const el = makeTileEl(d.tile, { tiny: true, extra: 'discard' });
        if (latest && latest.seat === seat && di === discs.length - 1) el.classList.add('fresh');
        pile.appendChild(el);
      });
    }

    // 玩家区
    const myFlowers = $('my-flowers');
    if (myFlowers) {
      myFlowers.innerHTML = '';
      me.flowers.forEach(f => myFlowers.appendChild(makeTileEl(f, { tiny: true, extra: 'flower' })));
    }
    const myScore = $('my-score');
    if (myScore) myScore.textContent = '本局分: ' + me.score;
    // melds
    const meldRow = $('my-melds');
    if (meldRow) {
      meldRow.innerHTML = '';
      me.melds.forEach(m => {
        const wrap = document.createElement('div');
        wrap.className = 'meld';
        if (m.type === 'chi' && m.tiles) {
          m.tiles.forEach(tt => wrap.appendChild(makeTileEl(tt, { tiny: true })));
        } else {
          // 碰/杠 显示3或4张
          const cnt = (m.type === 'gang' || m.type === 'bugang') ? 4 : 3;
          for (let i = 0; i < cnt; i++) {
            const el = makeTileEl(m.tile, { tiny: true });
            if (i === 0 && m.type === 'gang' && !m.isAn) el.textContent = (m.isAn ? '' : T.tileToString(m.tile));
            wrap.appendChild(el);
          }
        }
        meldRow.appendChild(wrap);
      });
    }
    // 手牌（可点击）
    const handRow = $('my-hand');
    if (handRow) {
      handRow.innerHTML = '';
      const sorted = me.hand.map((t, i) => ({ t, i }));
      sorted.sort((a, b) => suitOrder(a.t) - suitOrder(b.t));
      sorted.forEach(({ t, i }) => {
        const el = makeTileEl(t, {});
        if (t.suit === 'flower') {
          // 花牌不该在手牌里（正常已被摊开），兜底
        }
        // 标记财神
        if (R.isGod(t, snap.godTiles)) el.classList.add('god-mark');
        if (i === selectedIdx) el.classList.add('selected');
        el.dataset.idx = i;
        el.addEventListener('click', () => onMyTileClick(i, el));
        el.addEventListener('dblclick', () => onMyTileDblClick(i, t)); // 双击直接打出
        handRow.appendChild(el);
      });
    }

    renderActionButtons(snap);
    renderMessage(snap);
    renderThinking(snap);
  }

  /* ============ 倒计时钟（当前行动玩家前方） ============ */
  let thinkTicker = null;
  const RING_LEN = 163.4; // 2πr, r=26

  /** 渲染倒计时钟：挂在当前行动玩家前方（我上方/对家下方/左家右方/右家左方），250ms 自刷新 */
  function renderThinking(snap) {
    const info = snap.thinking || null;
    const clock = $('countdown-clock');
    const remainMs = info ? Math.max(0, info.until - Date.now()) : 0;
    const remain = Math.ceil(remainMs / 1000);
    if (clock) {
      if (info) {
        const total = Math.max(0.1, (info.until - info.startedAt) / 1000);
        clock.className = 'show pos-' + info.seat + (remain <= 5 ? ' urgent' : '');
        $('clock-num').textContent = remain;
        const ring = clock.querySelector('.clock-ring');
        if (ring) ring.style.strokeDashoffset = (RING_LEN * (1 - Math.min(1, remainMs / 1000 / total))).toFixed(1);
      } else {
        clock.className = '';
      }
    }
    // 顶栏提示（短文案，适配手机窄屏）
    const hint = $('turn-info');
    if (info && hint) {
      hint.textContent = info.seat === 1
        ? '你出牌 · ' + remain + 's'
        : T.FENG_NAMES[info.seat - 1] + '家 · ' + remain + 's';
    }
    // 有倒计时进行时启动自刷新，没有则停掉
    if (info && !thinkTicker) {
      thinkTicker = setInterval(() => { if (game) renderThinking(game.snapshot()); }, 250);
    } else if (!info && thinkTicker) {
      clearInterval(thinkTicker);
      thinkTicker = null;
    }
  }

  /* ============ 消息 ============ */

  function renderMessage(snap) {
    const bar = $('msg-bar');
    if (!bar) return;
    if (snap.roundInfo) {
      const ri = snap.roundInfo;
      if (ri.isHumanWin) bar.textContent = '恭喜胡牌！' + ri.winType === 'self' ? '自摸' : '点炮';
      else bar.textContent = ri.winnerName + (ri.winType === 'self' ? ' 自摸胡牌' : ' 胡牌');
    } else if (snap.drawGame) {
      bar.textContent = '牌墙摸完，流局';
    } else if (snap.log && snap.log.length) {
      bar.textContent = snap.log[snap.log.length-1].msg;
    }
  }

  /* ============ 操作按钮 ============ */

  /** 玩家手牌是否有暗杠（4张同牌，需真实牌非财神） */
  function canHumanAnGang(snap) {
    const me = snap.players.find(p => p.isHuman);
    if (!me || !me.hand) return false;
    const cnt = {};
    for (const t of me.hand) {
      if (R.isGod(t, snap.godTiles)) continue;
      const k = t.suit + '|' + t.num;
      cnt[k] = (cnt[k] || 0) + 1;
    }
    return Object.values(cnt).some(v => v >= 4);
  }

  /** 玩家是否有可补杠（碰过的牌手牌中还有第4张） */
  function canHumanBuGang(snap) {
    const me = snap.players.find(p => p.isHuman);
    if (!me || !me.hand) return false;
    const pengTiles = me.melds.filter(m => m.type === 'peng').map(m => m.tile);
    return pengTiles.some(pt => me.hand.some(t => T.sameTile(t, pt)));
  }

  function showAction(btnId, show) {
    const el = $(btnId);
    if (el) el.style.display = show ? '' : 'none';
  }

  function renderActionButtons(snap) {
    const phase = snap.phase;
    showAction('btn-chi', false);
    showAction('btn-peng', false);
    showAction('btn-gang', false);
    showAction('btn-hu', false);
    showAction('btn-pass', false);
    // 出牌按钮：仅轮到我打牌且有选中牌时出现
    showAction('btn-discard', phase === 'waitHumanDiscard' && selectedIdx >= 0);

    if (phase === 'waitHumanClaim') {
      const myClaims = claimCandidates.filter(c => c.seat === 1);
      const has = (a) => myClaims.some(c => c.action === a);
      showAction('btn-hu', has('hu'));
      showAction('btn-peng', has('peng'));
      showAction('btn-gang', has('gang'));
      showAction('btn-chi', has('chi'));
      showAction('btn-pass', true);
      if (has('chi')) $('btn-chi').style.display = '';
    } else if (phase === 'waitHumanChi') {
      // 吃法选择已由弹窗接管，隐藏按钮
      showAction('btn-chi', false);
      showAction('btn-pass', true);
    } else if (phase === 'waitHumanDiscard') {
      // 暗杠 / 补杠入口
      const hasAnGang = canHumanAnGang(snap);
      const hasBuGang = canHumanBuGang(snap);
      if (hasAnGang || hasBuGang) {
        const gangBtn = $('btn-gang');
        if (gangBtn) {
          gangBtn.textContent = hasBuGang ? '补杠' : '暗杠';
          gangBtn.dataset.mode = hasBuGang ? 'bugang' : 'angang';
          gangBtn.style.display = '';
          gangBtn.onclick = () => {
            if (hasBuGang) { if (game) game.humanBuGang(); }
            else { if (game) game.humanAnGang(); }
          };
        }
      } else {
        const gangBtn = $('btn-gang');
        if (gangBtn) {
          gangBtn.style.display = 'none';
          gangBtn.onclick = () => { if (game) game.humanClaim('gang'); };
        }
      }
    }
    // 若在等待打牌且无选中牌，给提示
    const hint = $('turn-info');
    if (hint && phase === 'waitHumanDiscard' && !snap.thinking) hint.textContent = '轮到你（双击/出牌）';
  }

  /* ============ 玩家点击手牌 ============ */

  function onMyTileClick(idx, el) {
    if (!game || game.phase !== 'waitHumanDiscard') return;
    if (selectedIdx === idx) {
      // 再次点击 = 确认打出
      game.humanDiscard(idx);
      selectedIdx = -1;
    } else {
      selectedIdx = idx;
      refreshSelection();
    }
  }

  /** 双击牌面直接打出 */
  function onMyTileDblClick(idx, t) {
    if (!game || game.phase !== 'waitHumanDiscard') return;
    selectedIdx = -1;
    game.humanDiscard(idx);
  }

  function refreshSelection() {
    const handRow = $('my-hand');
    const children = handRow.children;
    for (let i = 0; i < children.length; i++) {
      const el = children[i];
      if (parseInt(el.dataset.idx, 10) === selectedIdx) el.classList.add('selected');
      else el.classList.remove('selected');
    }
    // 出牌按钮跟随选中状态
    const discBtn = $('btn-discard');
    if (discBtn) discBtn.style.display = (game && game.phase === 'waitHumanDiscard' && selectedIdx >= 0) ? '' : 'none';
  }

  function flashMsg(msg) {
    const bar = $('msg-bar');
    if (bar) {
      bar.textContent = msg;
      setTimeout(() => { if (game) renderMessage(game.snapshot()); }, 1500);
    }
  }

  /* ============ 按钮事件 ============ */

  function bindButtons() {
    // 出牌按钮：打出当前选中的牌
    $('btn-discard').addEventListener('click', () => {
      if (game && game.phase === 'waitHumanDiscard' && selectedIdx >= 0) {
        game.humanDiscard(selectedIdx);
        selectedIdx = -1;
      }
    });
    $('btn-pass').addEventListener('click', () => {
      if (!game || game.phase === 'waitHumanChi') {
        if (game && game.phase === 'waitHumanChi') {
          const chis = game.needChiChoice;
          game.needChiChoice = null;
          hideChiOverlay();
          // 放弃吃 → 走 pass
          game.pendingClaims = game.pendingClaims.filter(c => c.seat !== 1);
          game.claimsPassedCheck();
        } else if (game) {
          game.humanClaim('pass');
        }
        return;
      }
      game.humanClaim('pass');
    });
    $('btn-hu').addEventListener('click', () => game && game.humanClaim('hu'));
    $('btn-peng').addEventListener('click', () => game && game.humanClaim('peng'));
    $('btn-gang').addEventListener('click', () => game && game.humanClaim('gang'));
    $('btn-chi').addEventListener('click', () => {
      if (game && game.phase === 'waitHumanChi') {
        // 已进入吃法选择状态，忽略
      } else if (game) {
        game.humanClaim('chi');
      }
    });
    $('btn-restart').addEventListener('click', () => {
      if (confirm('确定重新开局吗？')) startNewGame();
    });
    $('btn-fullscreen').addEventListener('click', toggleFullscreen);
    $('btn-next').addEventListener('click', () => {
      hideOverlay();
      game.nextRound();
    });
    $('btn-again').addEventListener('click', () => {
      hideOverlay();
      startNewGame();
    });
    $('btn-chi-cancel').addEventListener('click', () => {
      if (game && game.phase === 'waitHumanChi') {
        game.needChiChoice = null;
        game.pendingClaims = game.pendingClaims.filter(c => c.seat !== 1);
        game.claimsPassedCheck();
      }
      hideChiOverlay();
    });
  }

  /* ============ 吃法选择弹窗 ============ */

  function showChiOverlay(chis) {
    const box = $('chi-options');
    box.innerHTML = '';
    chis.forEach((chi, vi) => {
      const opt = document.createElement('div');
      opt.className = 'chi-opt';
      chi.forEach(tt => opt.appendChild(makeTileEl(tt, { tiny: true })));
      opt.addEventListener('click', () => {
        hideChiOverlay();
        if (game) game.humanChiVariant(vi);
      });
      box.appendChild(opt);
    });
    $('chi-overlay').style.display = 'flex';
  }
  function hideChiOverlay() { $('chi-overlay').style.display = 'none'; }

  /* ============ 结算弹窗 ============ */

  function showOverlay(snap) {
    const ri = snap.roundInfo;
    if (!ri) {
      // 流局展示
      $('result-title').textContent = '🀄 牌墙摸完 · 流局';
      $('result-tai').textContent = '—';
      $('result-detail').textContent = '本局无人胡牌，重新开局吧';
      $('result-scores').innerHTML = '';
      $('result-hand').innerHTML = '';
      $('overlay').style.display = 'flex';
      return;
    }
    const title = $('result-title');
    title.textContent = (ri.isHumanWin ? '🎉 恭喜胡牌！' : ri.winnerName + ' 胡牌') + (ri.winType === 'self' ? '（自摸）' : '（点炮）');
    $('result-tai').textContent = ri.tai + ' 台';
    $('result-detail').textContent = ri.details.join('  ·  ');
    // 各家得分
    const meSeat = 1;
    let scoreHtml = '';
    for (const seat of [1, 2, 3, 4]) {
      const p = snap.players.find(x => x.seat === seat);
      const delta = (ri.scores && ri.scores[seat]) || 0;
      const prefix = seat === ri.winnerSeat ? '🏆' : '';
      const cls = seat === meSeat ? 'me' : '';
      scoreHtml += `<div class="${cls}">${prefix}${T.FENG_NAMES[seat-1]}家${p.isHuman ? '(我)' : ''}: ${delta > 0 ? '+' : ''}${delta} 分</div>`;
    }
    $('result-scores').innerHTML = scoreHtml;
    // 胡牌手牌展示（还原手牌+明面子）
    const winner = snap.players.find(x => x.seat === ri.winnerSeat);
    const handEl = $('result-hand');
    handEl.innerHTML = '';
    if (winner && winner.huInfo && (winner.huInfo.handRaw || winner.huInfo.meldsRaw)) {
      // 明面子优先
      const group = document.createElement('div');
      group.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:6px;';
      if (winner.huInfo.meldsRaw && winner.huInfo.meldsRaw.length) {
        const meldWrap = document.createElement('div');
        meldWrap.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;justify-content:center;';
        winner.huInfo.meldsRaw.forEach(m => {
          const mEl = document.createElement('div');
          mEl.style.cssText = 'display:flex;gap:1px;background:#d8cfae;border:1px solid #b8a97a;padding:2px;border-radius:4px;';
          const label = document.createElement('div');
          label.style.cssText = 'font-size:8px;color:#8a7a50;display:flex;align-items:center;padding:0 2px;writing-mode:vertical-lr;';
          label.textContent = m.type === 'chi' ? '吃' : (m.type === 'peng' ? '碰' : (m.type === 'gang' ? (m.isAn ? '暗杠' : '明杠') : '补杠'));
          mEl.appendChild(label);
          const tilesForMeld = m.type === 'chi' ? (m.tiles || []) : Array(m.type === 'gang' || m.type === 'bugang' ? 4 : 3).fill(m.tile);
          tilesForMeld.forEach(tt => mEl.appendChild(makeTileEl(tt, { small: true })));
          meldWrap.appendChild(mEl);
        });
        group.appendChild(meldWrap);
      }
      const handWrap = document.createElement('div');
      handWrap.style.cssText = 'display:flex;gap:2px;flex-wrap:wrap;justify-content:center;';
      (winner.huInfo.handRaw || []).forEach(tt => handWrap.appendChild(makeTileEl(tt, { small: true })));
      group.appendChild(handWrap);
      handEl.appendChild(group);
    } else if (winner && winner.huInfo && winner.huInfo.hand) {
      handEl.textContent = winner.huInfo.hand.join(' ');
    }
    $('overlay').style.display = 'flex';
  }
  function hideOverlay() { $('overlay').style.display = 'none'; }

  /* ============ 游戏生命周期 ============ */

  function startNewGame() {
    if (game && game.destroy) game.destroy(); // 清掉旧对局的人机思考计时器
    game = new GameClass({
      humanSeat: 1, bottom: 1, cap: 0,
      // 出牌统一 20s 倒计时：所有玩家规则相同——在倒计时 20~1s 之间的随机时刻出牌
      thinkDelayMs: (seat, kind) => {
        if (kind === 'claim') {
          // 声明决策（吃/碰/杠/胡）：0.5 ~ 4s 短思考
          return 500 + Math.floor(Math.random() * 3500);
        }
        // 出牌：1~19s 后打出（即倒计时走到 19~1s 之间的随机时刻）
        return 1000 + Math.floor(Math.random() * 18000);
      },
      // 人类玩家同样 20s 倒计时，超时未出牌 → 随机打出一张
      humanTimeoutMs: 20000,
    });
    selectedIdx = -1;
    claimCandidates = [];
    game.onUpdate = (snap) => {
      // 声明候选（同步给按钮逻辑用）
      claimCandidates = snap.pendingClaims.map(c => Object.assign({}, c));
      render(snap);
      if (snap.phase === 'waitHumanClaim') {
        const myHu = claimCandidates.find(c => c.seat === 1 && c.action === 'hu');
        // 自动胡：能胡必胡(简化体验)，否则等玩家操作
        if (myHu) {
          setTimeout(() => { if (game) game.humanClaim('hu'); }, 400);
        }
      } else if (snap.phase === 'waitHumanChi') {
        if (game.needChiChoice && game.needChiChoice.length) {
          showChiOverlay(game.needChiChoice);
        }
      } else if (snap.phase === 'waitHumanDiscard') {
        hideChiOverlay();
      }
      if (snap.roundInfo || snap.drawGame) {
        setTimeout(() => { if (game && (game.phase === 'over')) showOverlay(game.snapshot()); }, 500);
      }
    };
    game.start();
    window.__mj = game; // 调试句柄（控制台可用 __mj.snapshot() 查看引擎状态）
  }

  /* ============ 手机端强制横屏 ============ */
  /** 触屏手机：竖屏持机时给 body 加 landscape-lock，把整个牌桌旋转 90° 横屏显示 */
  function fitOrientation() {
    const b = document.body;
    const mobile = ('ontouchstart' in window) || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const portrait = window.innerHeight > window.innerWidth;
    b.classList.toggle('mobile', mobile);
    b.classList.toggle('landscape-lock', mobile && portrait);
  }

  /* ============ 全屏 ============ */

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFsBtn() {
    const b = $('btn-fullscreen');
    if (b) b.textContent = isFullscreen() ? '退出全屏' : '全屏';
  }
  /** 切换全屏：整个屏幕都是牌桌；Android 全屏时同时锁定横屏。iOS 微信不支持时给"添加到主屏幕"兜底提示 */
  function toggleFullscreen() {
    const doc = document, el = doc.documentElement;
    if (isFullscreen()) {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
      try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
      return;
    }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el, { navigationUI: 'hide' });
        if (p && p.then) {
          p.then(() => {
            // Android：全屏后顺手锁定横屏（不支持的系统静默忽略）
            try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {}
          });
          if (p.catch) p.catch(() => flashMsg('当前浏览器不支持全屏：可「添加到主屏幕」获得全屏体验'));
        }
      } catch (e) {
        flashMsg('当前浏览器不支持全屏：可「添加到主屏幕」获得全屏体验');
      }
    } else {
      flashMsg('当前浏览器不支持全屏：可「添加到主屏幕」获得全屏体验');
    }
  }

  /* ============ 初始化 ============ */

  function init() {
    fitOrientation();
    window.addEventListener('resize', fitOrientation);
    window.addEventListener('orientationchange', fitOrientation);
    document.addEventListener('fullscreenchange', syncFsBtn);
    document.addEventListener('webkitfullscreenchange', syncFsBtn);
    bindButtons();
    startNewGame();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
